<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Pop! 英语单词卡 · 交互原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC; --card:#FFFFFF; --line:#EDDEC8;
    --ink:#3B2E2A; --sub:#7D6F64; --coral:#E8613C; --gold:#F5B301;
    --wfont:'Baloo 2',ui-rounded,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{min-height:100%}
  body{margin:0;height:100dvh;overflow:hidden;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:0;padding:0}
  button:focus-visible,summary:focus-visible,.word:focus-visible,.stage:focus-visible{outline:3px solid #2F7FBF;outline-offset:3px}
  header{width:min(100% - 32px,980px);margin:0 auto;padding:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:var(--wfont);font-weight:800;font-size:21px;color:var(--coral)}
  .stars{font-size:14px;font-weight:800;color:#A77800;display:flex;align-items:center;gap:4px}
  .stars .pop{animation:pop .5s ease}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
  .islands{width:min(100% - 32px,980px);margin:0 auto;display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .islands::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:#6B5A4E}
  .chip.now{background:#FFF0E6;border-color:var(--coral);color:#A64429}
  main{width:min(100% - 32px,980px);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:0 0 10px}
  .center-col{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:27px;padding:clamp(10px,2vh,22px);box-shadow:0 7px 0 #F3E8D7}
  .stage-wrap{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
  .stage-caption{display:none}
  .stage{position:relative;height:min(100%,410px);width:auto;max-width:100%;aspect-ratio:1;background:#FFF9F0;border:1.5px solid #F3E6D4;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .stage svg{width:80%;height:80%}
  .stage.cheered{background:#FFFBE8}
  .star-fx{position:absolute;top:10px;right:14px;font-size:26px;opacity:0;transform:scale(.3);transition:all .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
  .star-fx.show{opacity:1;transform:scale(1)}
  .audio-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(59,46,42,.7);color:#fff;border-radius:999px;font-size:12px;padding:4px 12px;pointer-events:none;opacity:0;transition:opacity .2s}
  .stage.speaking .audio-hint{opacity:1}
  .deck{min-width:0;display:flex;flex-direction:column;gap:clamp(8px,2vh,22px);justify-content:center}
  .deck.slide-r{animation:slideR .3s ease}.deck.slide-l{animation:slideL .3s ease}
  @keyframes slideR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
  .word{font-family:var(--wfont);font-weight:800;font-size:clamp(48px,6vw,72px);line-height:1.05;color:var(--coral);cursor:pointer;user-select:none;max-width:100%;overflow-wrap:anywhere}
  .word.hidden-mode{color:transparent;text-shadow:0 0 24px rgba(232,97,60,.75)}
  .meta{font-size:14px;color:var(--sub);margin-top:5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .type{background:#F0F4E8;color:#4E7139;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
  .zh{font-weight:750;color:var(--ink)}
  .spell{display:none;flex-direction:column;gap:10px;align-items:flex-start}
  .spell.on{display:flex}
  .slots,.pool{display:flex;gap:6px;flex-wrap:wrap}
  .slot{width:clamp(31px,4vw,43px);height:clamp(40px,5vw,52px);border-radius:10px;background:#fff;border:2px dashed #E8BE80;display:flex;align-items:center;justify-content:center;font-family:var(--wfont);font-size:25px;font-weight:800;color:#9B6426}
  .slot.filled{background:#FFF3E4;border-style:solid;animation:pop .35s ease}
  .pool button{width:44px;height:44px;border-radius:12px;background:#FFF2D8;box-shadow:0 2px 0 #EAD9BC;font-family:var(--wfont);font-size:24px;font-weight:800;color:#A5661D}
  .pool button.used{opacity:.2;pointer-events:none}
  .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .actions button{height:clamp(42px,6vh,54px);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:23px;box-shadow:0 3px 0 rgba(59,46,42,.1)}
  .actions button small{font-size:14px;font-weight:750}
  .btn-say{background:var(--coral);color:#fff}
  .btn-slow{background:#E8F4FD;color:#246B9F}
  .btn-spell{background:#F3EAFB;color:#694685}
  .btn-hide{background:#FFF0DD;color:#94601E}
  .actions button:active,.pool button:active{transform:translateY(2px);box-shadow:none}
  .support-row{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:10px}
  .coach{display:flex;align-items:center;gap:10px;background:#FFF0DD;border-radius:17px;padding:8px 12px}
  .coach-icon{font-size:26px;flex:0 0 auto}
  .coach strong{font-size:13px;color:#915820}
  .coach p{margin:2px 0 0;font-size:13px;line-height:1.4}
  .more{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;color:#67594D}
  .more summary{height:100%;cursor:pointer;list-style:none;padding:11px 15px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .more summary::-webkit-details-marker{display:none}
  .more[open] summary span{transform:rotate(180deg)}
  .more-grid{position:absolute;z-index:3;right:0;bottom:calc(100% + 8px);width:min(640px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 30px #3B2E2A22}
  .more-grid>div{background:#FFF9F1;border-radius:12px;padding:12px;font-size:13px;line-height:1.5}
  .more-grid b{color:#594A3E}.more-grid p{margin:5px 0 0}
  nav{flex:0 0 auto;position:sticky;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:14px;padding:9px 16px calc(9px + env(safe-area-inset-bottom));background:rgba(255,248,236,.96);border-top:1px solid var(--line)}
  nav button.arrow{width:46px;height:46px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:20px;font-weight:800;color:var(--ink)}
  .dots{display:flex;gap:7px;justify-content:center}
  .dot{width:29px;height:29px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:#7D6F64}
  .dot.now{background:var(--coral);border-color:var(--coral);color:#fff}
  .dot.got:not(.now){background:#FFE8A0;color:#6F5200}
  @media(min-width:701px) and (max-height:560px){
    header{padding:5px 0 3px}.logo{font-size:18px}
    .islands{padding-bottom:5px}.chip{padding:4px 10px;font-size:12px}
    main{gap:6px;padding-bottom:6px}
    .center-col{padding:8px;gap:12px}
    .deck{gap:6px}.word{font-size:42px}.meta{font-size:12px}
    .spell{gap:5px}.slots,.pool{gap:4px}
    .slot{width:32px;height:34px;font-size:20px}.pool button{width:36px;height:36px;font-size:20px}
    .actions{gap:6px}.actions button{height:38px;font-size:19px}.actions button small{font-size:12px}
    .support-row{gap:6px}.coach{padding:4px 9px}.coach-icon{font-size:20px}.coach strong{font-size:11px}.coach p{font-size:12px;line-height:1.2}
    .more summary{padding:4px 10px;font-size:12px}
    nav{padding:4px 16px}nav button.arrow{width:38px;height:38px}.dot{width:24px;height:24px}
  }
  @media(max-width:700px){
    body{height:auto;min-height:100dvh;overflow:visible}
    header{padding:10px 0 7px}.logo{font-size:19px}
    .islands{padding-bottom:9px}
    main{gap:10px;padding-bottom:14px}
    .center-col{flex:none;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:22px}
    .stage-wrap{height:auto}
    .stage{height:auto;width:min(100%,275px);border-radius:18px}
    .stage-caption{display:block;font-size:11px;color:var(--sub)}
    .deck{width:100%;align-items:center;gap:11px}
    .word-zone{text-align:center}
    .word{font-size:clamp(43px,12vw,57px)}
    .meta{justify-content:center;margin-top:0;font-size:13px}
    .type{display:none}
    .spell{align-items:center;width:100%}.slots,.pool{justify-content:center}
    .actions{width:100%;gap:8px}
    .actions button{height:49px;font-size:21px}
    .actions button small{font-size:13px}
    .coach{padding:10px 12px;gap:10px}.coach-icon{font-size:23px}.coach p{font-size:13px}
    .support-row{display:flex;flex-direction:column}
    .more summary{height:auto}
    .more-grid{position:static;width:auto;grid-template-columns:1fr;border:0;box-shadow:none;padding:0 15px 15px}
  }
  @media(max-width:360px){.stage{width:min(100%,255px)}.center-col{padding:11px}.slot{width:31px;height:39px}.pool button{width:39px;height:39px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <span class="logo">Word&nbsp;Pop!</span>
  <div class="stars"><span id="starIcon">⭐</span><span id="starNum">0</span></div>
</header>

<div class="islands" id="islands"></div>

<main>
  <div class="center-col">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage" role="button" tabindex="0" aria-label="点图朗读当前单词">
        <span class="star-fx" id="starFx">⭐</span>
        <span class="audio-hint">正在发音</span>
        <div id="art" style="display:contents"></div>
      </div>
      <span class="stage-caption">点图听音 · 左右滑图换卡</span>
    </div>

    <div class="deck" id="deck">
      <div class="word-zone">
        <div class="word" id="word" role="button" tabindex="0" title="点击发音">apple</div>
        <div class="meta">
          <span class="type" id="type">名词 · 实物</span>
          <span class="zh" id="zh">苹果</span>
          <span id="ipa">/ˈæp.əl/</span>
        </div>
      </div>

      <div class="spell" id="spell">
        <div class="slots" id="slots"></div>
        <div class="pool" id="pool"></div>
      </div>

      <div class="actions">
        <button class="btn-say"  onclick="speak(false)" aria-label="读一遍"><span aria-hidden="true">🔊</span><small>读一遍</small></button>
        <button class="btn-slow" onclick="speak(true)" aria-label="慢慢读"><span aria-hidden="true">🐢</span><small>慢慢读</small></button>
        <button class="btn-spell" id="btnSpell" onclick="toggleSpell()" aria-label="拼一拼"><span aria-hidden="true">🧩</span><small>拼一拼</small></button>
        <button class="btn-hide"  id="btnHide" onclick="toggleHide()" aria-label="藏起字"><span aria-hidden="true">🙈</span><small>藏起字</small></button>
      </div>
    </div>
  </div>

  <div class="support-row">
    <section class="coach" aria-label="亲子互动建议">
      <span class="coach-icon" aria-hidden="true">💬</span>
      <div><strong>一起试试</strong><p id="tipSay"></p></div>
    </section>
    <details class="more" id="moreTips">
      <summary>更多玩法与卡片说明 <span aria-hidden="true">⌄</span></summary>
      <div class="more-grid">
        <div><b>🎯 问一问</b><p id="tipChat"></p></div>
        <div><b>🏠 生活里</b><p id="tipLife"></p></div>
        <div><b>🎨 画面线索</b><p id="tipHow"></p></div>
      </div>
    </details>
  </div>
</main>

<nav>
  <button class="arrow" onclick="step(-1)" aria-label="上一个单词">←</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" onclick="step(1)" aria-label="下一个单词">→</button>
</nav>

/* ---------- 状态 ---------- */
let islandIdx = 0, i = 0, hideMode = false, spellOn = false, spellPos = 0;
let got = JSON.parse(localStorage.getItem("wp2_stars") || "{}");
let stars = parseInt(localStorage.getItem("wp2_starTotal") || "0", 10);
const ISLANDS = [...new Set(WORDS.map(w => w.island))];
const $ = id => document.getElementById(id);
const curIsland = () => WORDS.filter(w => w.island === ISLANDS[islandIdx]);
const curWord = () => curIsland()[i];

/* ---------- 发音 ---------- */
let VOICE = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  const natural = vs.filter(v => /en[-_]US/i.test(v.lang) &&
    !/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Fred|Good News|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox/i.test(v.name));
  VOICE = natural.find(v => /Google US English/i.test(v.name))
       || natural.find(v => /Samantha/i.test(v.name))
       || natural.find(v => /Ava|Allison|Susan/i.test(v.name))
       || natural.find(v => v.default) || natural[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speechSeq = 0;
function stopSpeech(){
  speechSeq++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("stage").classList.remove("speaking");
}
function speak(slow){
  if (!("speechSynthesis" in window)) return;
  stopSpeech();
  const seq = speechSeq;
  const u = new SpeechSynthesisUtterance(curWord().w);
  u.lang = "en-US"; if (VOICE) u.voice = VOICE;
  u.rate = slow ? 0.55 : 1.05; u.pitch = 1;
  u.onstart = () => { if (seq === speechSeq) $("stage").classList.add("speaking"); };
  u.onend = u.onerror = () => { if (seq === speechSeq) $("stage").classList.remove("speaking"); };
  speechSynthesis.speak(u);
}

/* ---------- 渲染 ---------- */
function renderIslands(){
  $("islands").innerHTML = ISLANDS.map((n, k) =>
    `<button class="chip ${k===islandIdx?"now":""}" onclick="goIsland(${k})">${n}</button>`).join("");
}
function renderDots(){
  $("dots").innerHTML = curIsland().map((w, k) =>
    `<button class="dot ${k===i?"now":""} ${got[w.w]?"got":""}" onclick="goCard(${k})" aria-label="第 ${k+1} 张：${w.w}" ${k===i?'aria-current="true"':''}>${k+1}</button>`).join("");
}
function render(anim){
  const c = curWord();
  $("art").innerHTML = c.art;
  const w = $("word");
  w.textContent = c.w;
  w.classList.toggle("hidden-mode", hideMode);
  w.onclick = () => { if (hideMode) reveal(); else speak(false); };
  w.setAttribute("aria-label", hideMode ? "揭晓单词" : `朗读 ${c.w}`);
  $("stage").setAttribute("aria-label", hideMode ? "点图揭晓单词" : `点图朗读 ${c.w}`);
  $("type").textContent = c.type;
  $("zh").textContent = c.zh;
  $("ipa").textContent = c.ipa;
  $("tipSay").textContent = c.say;
  $("tipChat").textContent = c.chat;
  $("tipLife").textContent = c.life;
  $("tipHow").textContent = c.how;
  $("starNum").textContent = stars;
  spellOn = false; $("spell").classList.remove("on");
  $("btnHide").innerHTML = hideMode ? '<span aria-hidden="true">👀</span><small>看答案</small>' : '<span aria-hidden="true">🙈</span><small>藏起字</small>';
  $("btnHide").setAttribute("aria-label", hideMode ? "看答案" : "藏起字");
  renderDots();
  if (anim){
    const d = $("deck");
    d.classList.remove("slide-l","slide-r"); void d.offsetWidth;
    d.classList.add(anim);
  }
}

/* ---------- 翻卡 / 切岛 ---------- */
function step(d){
  stopSpeech();
  const n = curIsland().length;
  i = (i + d + n) % n;
  hideMode = false; render(d > 0 ? "slide-r" : "slide-l");
}
function goCard(k){
  if (k === i) return;
  stopSpeech();
  const anim = k > i ? "slide-r" : "slide-l";
  i = k; hideMode = false; render(anim);
}
function goIsland(k){
  if (k === islandIdx) return;
  stopSpeech();
  islandIdx = k; i = 0; hideMode = false;
  renderIslands(); render("slide-r");
}
$("stage").addEventListener("click", ()=>{ if(hideMode) reveal(); else speak(false); });
for (const el of [$("stage"), $("word")]) el.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); el.click(); }
});

/* ---------- 藏字猜词 ---------- */
function toggleHide(){ hideMode = !hideMode; render(); if(hideMode) speak(false); }
function reveal(){ hideMode = false; render(); speak(false); award(); }

/* ---------- 拼写 ---------- */
function toggleSpell(){
  spellOn = !spellOn;
  $("spell").classList.toggle("on", spellOn);
  if (spellOn) buildSpell();
}
function buildSpell(){
  const c = curWord(); spellPos = 0;
  const letters = c.w.split("");
  $("slots").innerHTML = letters.map(() => `<div class="slot"></div>`).join("");
  const extra = "abcdefghilmnoprstuw".split("").filter(ch => !letters.includes(ch));
  const pool = letters.concat([extra[(i*7)%extra.length], extra[(i*3+5)%extra.length]]);
  $("pool").innerHTML = shuffle(pool).map(ch =>
    `<button data-c="${ch}" onclick="tryLetter(this,'${ch}')">${ch}</button>`).join("");
}
function shuffle(a){ return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]); }
function tryLetter(btn, ch){
  const c = curWord();
  if (ch === c.w[spellPos]){
    const slot = $("slots").children[spellPos];
    slot.textContent = ch; slot.classList.add("filled");
    btn.classList.add("used");
    spellPos++;
    if (spellPos === c.w.length){ setTimeout(()=>{
      if (curWord() === c && spellOn) { celebrate(); speak(false); }
    }, 450); }
  } else {
    btn.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}],{duration:260});
  }
}

/* ---------- 奖励 ---------- */
function celebrate(){
  award();
  const st = $("stage");
  st.classList.add("cheered");
  setTimeout(()=>st.classList.remove("cheered"), 1200);
}
function award(){
  const c = curWord();
  if (!got[c.w]){ got[c.w]=1; stars++;
    localStorage.setItem("wp2_stars", JSON.stringify(got));
    localStorage.setItem("wp2_starTotal", stars);
  }
  $("starNum").textContent = stars;
  const si = $("starIcon"); si.classList.remove("pop"); void si.offsetWidth; si.classList.add("pop");
  const s = $("starFx"); s.classList.remove("show"); void s.offsetWidth; s.classList.add("show");
  setTimeout(()=>s.classList.remove("show"), 1600);
  renderDots();
}

/* ---------- 键盘 / 滑动 ---------- */
document.addEventListener("keydown", e => {
  if (e.target.closest("button, summary")) return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === " ") { e.preventDefault(); if (hideMode) reveal(); else speak(false); }
  else if (/^[1-9]$/.test(e.key)) { const k = +e.key - 1; if (k < curIsland().length) goCard(k); }
});
let touchStart = null;
$("stageWrap").addEventListener("touchstart", e => {
  touchStart = {x:e.touches[0].clientX,y:e.touches[0].clientY};
}, {passive:true});
$("stageWrap").addEventListener("touchend", e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5) step(dx < 0 ? 1 : -1);
  touchStart = null;
}, {passive:true});

renderIslands();
render();
</script>
</body>
</html>
