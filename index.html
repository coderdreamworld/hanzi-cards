<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf8ec">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233e9486'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fdf8ec' font-family='serif'%3E字%3C/text%3E%3C/svg%3E">
  <title>孩子的卡片集</title>
  <style>
    :root { color-scheme: light; }
    body { margin:0; min-height:100svh; background:#fdf8ec; color:#4a3226;
           font-family: system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
           display:flex; flex-direction:column; align-items:center; padding:28px 18px 40px; box-sizing:border-box; gap:6px;}
    h1 { font-size:25px; margin:0 0 2px; }
    p.sub { margin:0 0 14px; color:#8d7d73; font-size:14px; }
    h2 { font-size:15px; color:#8d7d73; margin:18px 0 8px; font-weight:600; width:min(420px,100%);}
    a.card { display:block; width:min(420px,100%); background:#dff4f1; border-radius:16px; padding:14px 18px;
             text-decoration:none; color:#2f6b60; font-size:15px; text-align:center; margin-bottom:10px;}
    a.card b { display:block; font-size:18px; color:#3e9486; margin-bottom:3px;}
    a.card.warm { background:#fbe3dc; color:#a05a48; }
    a.card.warm b { color:#e8836f; }
    a.card.continue { background:#3e9486; color:#d8f6f1; }
    a.card.continue b { color:#fff; }
    .lastbadge { display:inline-block; font-style:normal; font-size:11px; background:#fff; color:#3e9486;
                 border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:2px; font-weight:700; }
    footer { font-size:12px; color:#b0a49a; margin-top:10px; text-align:center;}
  </style>
</head>
<body>
  <h1>孩子的卡片集 🎴</h1>
  <p class="sub">点开即用 · 微信里直接打开 · 建议点右上角「···」收藏</p>

  <h2>识字主卡</h2>
  <a class="card" href="./shizi-422.html?from=hub"><b>识字卡片 · 422 字全量</b>21 组 · 402 张卡（382 单字 + 20 对反义词）· 笔顺演示</a>

  <a class="card" href="./huiyi.html?from=hub"><b>会意字 · 拼字魔法</b>14 卡，部件相加猜新字</a>
  <a class="card" href="./bushou.html?from=hub"><b>部首家族 · 找朋友</b>10 个部首家族</a>

  <footer>家庭教育自用材料 · 手机竖屏体验最佳</footer>

<script>
/* 继续上次：读取各卡组写入的 hz.last（同域 localStorage），生成一键续看入口 */
(function () {
  try {
    var last = JSON.parse(localStorage.getItem("hz.last") || "null");
    if (!last || !last.url || !/^[\w.-]+\.html$/.test(last.url)) return;
    if (Date.now() - (last.ts || 0) > 1000 * 60 * 60 * 24 * 180) return;
    var esc = function (s) { var d = document.createElement("i"); d.textContent = s || ""; return d.innerHTML; };
    var a = document.createElement("a");
    a.className = "card continue";
    a.href = "./" + last.url + "?from=hub";
    a.innerHTML = "<b>▶ 继续上次 · " + esc(last.name) + "</b>第 " + esc(last.pos) +
      " 张" + (last.label ? "「" + esc(last.label) + "」" : "") + "，点这里接着看";
    var sub = document.querySelector("p.sub");
    sub.parentNode.insertBefore(a, sub.nextSibling);
    var entry = document.querySelector('a.card[href="./' + last.url + '?from=hub"]');
    if (entry) entry.querySelector("b").insertAdjacentHTML("beforeend", ' <i class="lastbadge">上次</i>');
  } catch (e) {}
})();
</script>
</body>
</html>
