  <script>
/* 继续上次：读取各卡组写入的 hz.last（同域 localStorage），生成一键续看入口 */
function refreshResume() {
  try {
    var stale = document.querySelector("a.card.continue");
    if (stale) stale.remove();
    document.querySelectorAll(".lastbadge").forEach(function (badge) { badge.remove(); });
    var last = JSON.parse(localStorage.getItem("hz.last") || "null");
    if (!last || !last.url || !/^[\w.-]+\.html$/.test(last.url)) return;
    if (Date.now() - (last.ts || 0) > 1000 * 60 * 60 * 24 * 180) return;
    var esc = function (s) { var d = document.createElement("i"); d.textContent = s || ""; return d.innerHTML; };
    var a = document.createElement("a");
    a.className = "card continue";
    a.href = "./" + last.url + "?from=hub";
    a.innerHTML = "<b>▶ 点击进入上次查看 · " + esc(last.name) + "</b>看到 " + esc(last.pos) +
      (last.label ? "「" + esc(last.label) + "」" : "") + "，点这里接着学";
    var sub = document.querySelector("p.sub");
    if (sub) sub.parentNode.insertBefore(a, sub.nextSibling);
    else document.body.insertBefore(a, document.body.firstChild);
    var entry = document.querySelector('a.card:not(.continue)[href="./' + last.url + '?from=hub"]');
    if (entry) entry.querySelector("b").insertAdjacentHTML("beforeend", ' <i class="lastbadge">上次</i>');
  } catch (e) {}
}
refreshResume();
/* 浏览器返回键会从往返缓存(bfcache)原样恢复页面、不重跑脚本——
   pageshow 时强制刷新续看入口，进度徽标才跟得上最新位置 */
window.addEventListener("pageshow", function () { refreshResume(); });
</script>
