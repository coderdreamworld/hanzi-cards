<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27f%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23ffe8a3%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23ffd1dc%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27url%28%23f%29%27%2F%3E%3Cpath%20d%3D%27M%20440%20848%20L%20528%20800%20L%20560%20760%27%20transform%3D%27translate%2812.36%2C48.32%29%20scale%280.037778%2C-0.037778%29%27%20fill%3D%27none%27%20stroke%3D%27%23e2574c%27%20stroke-width%3D%27150%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M%20240%20688%20L%20256%20656%20L%20240%20624%20L%20200%20552%20L%20184%20496%27%20transform%3D%27translate%2812.36%2C48.32%29%20scale%280.037778%2C-0.037778%29%27%20fill%3D%27none%27%20stroke%3D%27%23f2952f%27%20stroke-width%3D%27150%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M%20272%20624%20L%20296%20640%20L%20488%20672%20L%20744%20704%20L%20784%20688%20L%20800%20672%20L%20800%20656%20L%20728%20576%27%20transform%3D%27translate%2812.36%2C48.32%29%20scale%280.037778%2C-0.037778%29%27%20fill%3D%27none%27%20stroke%3D%27%23f2c94c%27%20stroke-width%3D%27150%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M%20328%20512%20L%20352%20504%20L%20384%20504%20L%20560%20560%20L%20600%20552%20L%20624%20528%20L%20608%20504%20L%20520%20408%27%20transform%3D%27translate%2812.36%2C48.32%29%20scale%280.037778%2C-0.037778%29%27%20fill%3D%27none%27%20stroke%3D%27%237fc8a9%27%20stroke-width%3D%27150%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M%20480%20416%20L%20512%20360%20L%20528%20296%20L%20544%20208%20L%20536%20136%20L%20520%2048%20L%20496%2016%20L%20368%2088%27%20transform%3D%27translate%2812.36%2C48.32%29%20scale%280.037778%2C-0.037778%29%27%20fill%3D%27none%27%20stroke%3D%27%234a7fd9%27%20stroke-width%3D%27150%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M%20136%20288%20L%20200%20272%20L%20376%20296%20L%20824%20336%20L%20864%20328%20L%20904%20312%27%20transform%3D%27translate%2812.36%2C48.32%29%20scale%280.037778%2C-0.037778%29%27%20fill%3D%27none%27%20stroke%3D%27%239b6fd4%27%20stroke-width%3D%27150%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="识字卡">
  <link rel="apple-touch-icon" sizes="180x180" href="touch-icon-v3.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#fdf8ec">
  <title>部首家族 · 找朋友</title>
  <style>
    :root {
      color-scheme: light;
      --page: #fdf8ec;
      --ink: #4a3226;
      --muted: #8d7d73;
      --accent: #5f8f52;
      --button: #dff4f1;
      --button-hover: #c5ebe7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--page); }
    body { color: var(--ink); font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

    .gallery {
      width: 100%; height: 100dvh; height: 100svh;
      display: flex; flex-direction: column;
      padding: max(44px, env(safe-area-inset-top)) 8px 10px;
    }
    .head { flex: 0 0 auto; min-height: 40px; text-align: center; padding: 2px 0 4px; }
    .head .t { font-size: 16px; font-weight: 700; color: var(--accent); }
    .head .s { font-size: 12px; color: var(--muted); margin-left: 8px; }
    .stage { min-height: 0; flex: 1; display: grid; place-items: center; }

    .card-svg {
      display: block;
      width: min(96vw, calc((100dvh - 128px) * 0.8));
      width: min(96vw, calc((100svh - 128px) * 0.8));
      aspect-ratio: 800 / 1000; height: auto;
      filter: drop-shadow(0 10px 24px rgba(112, 83, 49, 0.16));
      user-select: none; -webkit-user-drag: none;
    }

    .bar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      touch-action: pan-y;
    }
    button {
      border: 0; border-radius: 999px; background: var(--button); color: var(--ink);
      font: inherit; cursor: pointer; touch-action: manipulation; white-space: nowrap;
      transition: background 160ms ease, transform 140ms ease;
    }
    button:hover { background: var(--button-hover); }
    button:active { transform: scale(0.94); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .pill { flex: 0 0 auto; padding: 9px 13px; font-size: 14px; background: #fbeecb; }
    .pill[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .primary { flex: 0 0 auto; padding: 10px 22px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff; }
    .group-btn {
      flex: 0 0 auto; display: flex; align-items: baseline; justify-content: center; gap: 6px;
      padding: 9px 12px; font-size: 14px; background: #fff; border: 1.5px solid #ead9ac;
    }
    .group-btn.flash { background: #fdeaa0; border-color: var(--accent); }
    .group-btn .caret { color: var(--muted); font-size: 11px; }
    .counter { color: var(--muted); font-size: 13px; }

    .sheet-wrap { position: fixed; inset: 0; z-index: 30; }
    .sheet-wrap[hidden] { display: none; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(74, 50, 38, 0.35); }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      max-height: 62dvh; overflow: auto;
      background: var(--page); border-radius: 22px 22px 0 0;
      padding: 14px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 30px rgba(112, 83, 49, 0.25);
    }
    .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .sheet-grid .chip {
      border: 1.5px solid #ead9ac; background: #fff; color: var(--ink);
      border-radius: 14px; padding: 10px 6px; font-size: 14.5px; text-align: center;
      font-family: inherit; cursor: pointer; touch-action: manipulation;
    }
    .sheet-grid .chip.active { background: var(--accent); border-color: var(--accent); font-weight: 600; color: #fff; }

    .tips {
      flex: 0 0 auto; max-height: 30dvh; overflow: auto;
      margin: 0 4px 6px; padding: 12px 16px;
      background: #ffffff; border: 1.5px solid #f0dfb6; border-radius: 18px;
      font-size: 15px; line-height: 1.75;
    }
    .tips .lead { color: var(--muted); font-size: 13.5px; margin-bottom: 6px; }
    .tip-row { display: flex; gap: 8px; align-items: baseline; }
    .tip-tag { flex: 0 0 auto; color: #a07b33; font-size: 12.5px; background: #fbf0c2; border-radius: 8px; padding: 1px 8px; }

    body.static .head, body.static .bar, body.static .tips { display: none; }
    body.static .gallery { padding: 24px; }
    body.static .card-svg { width: min(92vw, 640px); filter: none; }

    body.grid { overflow: auto; }
    body.grid .gallery { height: auto; min-height: 100dvh; display: block; padding: 24px; }
    body.grid .head { margin-bottom: 14px; }
    body.grid .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 320px)); gap: 22px; justify-content: center; padding: 0; }
    body.grid .card-svg { width: 100%; max-width: 320px; filter: none; }
    body.grid .bar, body.grid .tips { display: none; }

    /* ════════ 宽屏版（≥960px，JS matchMedia 切 body.desk-on；横屏平板/电脑/横屏大手机） ════════ */
    #desk { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #desk[hidden] { display: none; }
    body.desk-on .head, body.desk-on .stage, body.desk-on .bar, body.desk-on .tips { display: none; }
    body.desk-on .gallery { padding: 0; }
    .desk-top { flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
                padding: 10px 20px; border-bottom: 2px solid #f3e7cd; background: #fbf3dd; }
    .desk-top h1 { font-size: 18px; margin: 0; white-space: nowrap; }
    .desk-top h1 .s { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
    .desk-chips { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding: 2px; }
    .dchip { border: 0; border-radius: 999px; background: var(--button); color: #2f6b60;
             padding: 6px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .dchip:hover { background: var(--button-hover); }
    .dchip.active { background: var(--accent); color: #fff; font-weight: 600; }
    .desk-state { border: 0; border-radius: 999px; background: var(--accent); color: #fff;
                  padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .desk-main { flex: 1; min-height: 0; display: grid; gap: 16px; padding: 14px 18px;
                 grid-template-columns: minmax(320px, 30vw) minmax(300px, 1fr) minmax(280px, 24vw); }
    @media (min-width: 1440px) {
      .desk-main { grid-template-columns: minmax(400px, 34vw) 1fr minmax(300px, 24vw); }
    }
    /* 880–959 的鼠标桌面：三栏压缩版 */
    @media (hover: hover) and (pointer: fine) and (min-width: 880px) and (max-width: 959.98px) {
      .desk-main { grid-template-columns: minmax(300px, 30vw) minmax(240px, 1fr) minmax(240px, 22vw); gap: 12px; padding: 10px 12px; }
    }
    .desk-main .zone { min-height: 0; }
    .card-box { height: 100%; display: flex; flex-direction: column; background: #fff9ea;
                border: 2px solid #f3e7cd; border-radius: 22px; padding: 14px; overflow: hidden; }
    .art-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .art-area svg { width: 100%; height: 100%; }
    .desk-pill { flex: 0 0 auto; margin: 10px 8px 4px; background: #d9f0ea; border-radius: 16px;
                 padding: 9px 12px; text-align: center; font-size: 17px; font-weight: 600; line-height: 1.5; }
    .desk-pill.q { background: #fbf0c2; font-weight: 500; color: #6b5a4e; font-size: 15px; }
    .desk-center { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column;
                   align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    .desk-center .board { position: relative; width: min(100%, 62vh); aspect-ratio: 1; }
    .desk-center .board svg { width: 100%; height: 100%; display: block; }
    .desk-center .hint { font-size: 13px; color: var(--muted); }
    .parts-row { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 0 10px; }
    .part-tile { background: #fbf3e2; border-radius: 16px; padding: 10px 12px; text-align: center; }
    .part-tile svg { width: 84px; height: 84px; display: block; }
    .part-tile .pl { font-size: 13px; color: #6b5a4e; margin-top: 4px; }
    .parts-plus { font-size: 34px; color: var(--accent); font-weight: 800; }
    .verse-box { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 4px; overflow: auto; }
    .verse-box .vt { font-size: 30px; color: var(--accent); font-weight: 800; margin-bottom: 10px; }
    .verse-box .vl { font-size: clamp(22px, 3.4vh, 34px); font-family: 'Songti SC','STSong','SimSun',serif;
                     font-weight: 700; letter-spacing: 0.12em; line-height: 1.7; }
    .verse-box .vl b { color: var(--accent); }
    .steps-box { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column;
                 justify-content: center; gap: 14px; padding: 0 12px; overflow: auto; }
    .step-row { display: flex; gap: 14px; align-items: baseline; }
    .step-n { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 999px; background: var(--accent);
              color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .step-t { font-size: clamp(18px, 2.6vh, 24px); font-family: 'Songti SC','STSong','SimSun',serif; font-weight: 600; }
    .steps-box .vt { text-align: center; font-size: 28px; color: var(--accent); font-weight: 800; margin-bottom: 4px; }
    .desk-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px; }
    .desk-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .desk-head .zi { font-size: 42px; font-weight: 700; line-height: 1; font-family: 'Songti SC','STSong','SimSun',serif; }
    .desk-head .meta { color: var(--muted); font-size: 14px; }
    .mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .mcell { background: #fbf3e2; border-radius: 12px; padding: 8px 10px; display: flex; align-items: baseline; gap: 8px; }
    .mcell .mc { font-size: 30px; font-weight: 700; font-family: 'Songti SC','STSong','SimSun',serif; }
    .mcell .mw { font-size: 13px; color: #6b5a4e; }
    .desk-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
                 padding: 10px 20px 14px; border-top: 2px solid #f3e7cd; background: #fbf3dd; }
    .nav-btn { border: 0; border-radius: 999px; background: var(--accent); color: #fff;
               width: 44px; height: 44px; font-size: 20px; cursor: pointer; flex: 0 0 auto; }
    .nav-btn:hover { filter: brightness(1.08); }
    .film { flex: 1; display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; }
    .mini { flex: 0 0 auto; width: 46px; height: 52px; border: 2px solid transparent; border-radius: 12px;
            background: var(--button); color: var(--ink); font-family: 'Songti SC','STSong','SimSun',serif;
            font-size: 26px; cursor: pointer; }
    .mini:hover { background: var(--button-hover); }
    .mini.active { border-color: var(--accent); background: #fff; font-weight: 700; }
    .mini.wide { width: auto; min-width: 46px; padding: 0 10px; font-size: 15px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; letter-spacing: 0.05em; }
    #desk .counter { font-size: 14px; white-space: nowrap; }
    /* 鼠标桌面窗口过窄（如缩放过大）：提示如何展开三栏 */
    .narrow-hint { display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
                   z-index: 60; background: #fbeecb; color: #6b5a4e; border: 1.5px solid #ead9ac;
                   border-radius: 999px; padding: 7px 14px; font-size: 13px; gap: 10px;
                   align-items: center; max-width: 92vw; }
    .narrow-hint .nh-x { cursor: pointer; color: #8d7d73; padding: 0 2px; }
    @media (hover: hover) and (pointer: fine) and (min-width: 700px) and (max-width: 879.98px) {
      body:not(.desk-on) .narrow-hint { display: flex; }
    }
      .home-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px 4px 9px; border: 1.5px solid #e6ded2; border-radius: 999px;
      background: #fff; color: #8a8078; font-size: 13px; font-weight: 600;
      text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .head { position: relative; }
    .head .home-btn { position: absolute; left: max(10px, env(safe-area-inset-left));
      top: 50%; transform: translateY(-50%); }
    @media (max-width: 380px) { .home-btn span { display: none; } }
  
    .home-btn:active{transform:scale(.94);background:#e8f4ee}
    @media(hover:hover){.home-btn:hover{background:#f6efe2}}
    @media(max-width:380px){.home-btn{padding:4px 8px}}
  </style>
  <script defer src="./analytics.js"></script>
</head>
<body>
  <main class="gallery" aria-label="汉语启蒙卡集">
    <header class="head" id="head"></header>
    <section class="stage" id="stage"><div id="cardWrap"></div></section>
    <section id="tips" class="tips" hidden></section>
    <nav class="bar" id="bar">
      <button id="primaryBtn" class="primary"></button>
      <button id="groupBtn" class="group-btn" aria-label="左右滑切换分组，轻点打开分组列表">
        <span id="groupName">—</span><span id="counter" class="counter"></span><span class="caret">▾</span>
      </button>
      <button id="toggleTips" class="pill" aria-pressed="false">提示</button>
    </nav>
    <div id="sheetWrap" class="sheet-wrap" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet"><div class="sheet-grid" id="sheetGrid"></div></div>
    </div>
    <div id="desk" hidden>
      <header class="desk-top"><a class="home-btn" href="index.html" aria-label="返回首页">🏠<span> 首页</span></a>
        <h1 id="deskTitle"></h1>
        <nav class="desk-chips" id="deskChips" hidden></nav>
        <button class="desk-state" id="deskState" hidden></button>
      </header>
      <section class="desk-main">
        <div class="zone"><div class="card-box" id="deskLeft"></div></div>
        <div class="zone"><div class="card-box"><div class="desk-center" id="deskCenter"></div></div></div>
        <div class="zone"><div class="card-box"><div class="desk-panel" id="deskPanel"></div></div></div>
      </section>
      <footer class="desk-foot">
        <button class="nav-btn" id="deskPrev" aria-label="上一张">←</button>
        <div class="film" id="deskFilm" aria-label="组内卡片"></div>
        <span class="counter" id="deskCounter"></span>
        <button class="nav-btn" id="deskNext" aria-label="下一张">→</button>
      </footer>
    </div>
      <div class="narrow-hint" id="narrowHint"><span>窗口有点窄～拉宽窗口，或按 ⌘0 恢复缩放，可展开完整三栏视图</span><span class="nh-x" onclick="this.parentNode.remove()">✕</span></div>
  </main>

  <script>
    const KIND = "family";

ge":"徽日","tips":[["家族故事","日是太阳。从早到晚，太阳管着时间。"],["怎么玩","先把成员字读一遍，再回头找共同点"],["聊一聊","明天、晚上、中午，哪些字里藏着太阳？"],["生活里","翻日历找“日”，说说“明天”“今晚”。"]],"g":0},{"type":"family","key":"族女","radical":"女","name":"女字家族","meaning":"带女字的字，和女孩子有关系。","members":[["妈","妈妈"],["奶","奶奶"],["妹","妹妹"],["她","她们"],["娃","娃娃"],["好","好人"]],"badge":"徽女","tips":[["家族故事","女字旁的字常和女孩子有关：妈妈、奶奶、妹妹。"],["怎么玩","先把成员字读一遍，再回头找共同点"],["聊一聊","数数家里几个女孩子，名字带女吗？"],["生活里","看全家福指认女孩，说说女字旁。"]],"g":0},{"type":"family","key":"族鸟","radical":"鸟","name":"鸟字家族","meaning":"带鸟字的字，都是长羽毛的朋友。","members":[["鸡","小鸡"],["鸭","鸭子"],["鹅","大鹅"],["鸦","乌鸦"],["鸣","鸟叫"]],"badge":"徽鸟","tips":[["家族故事","鸟字旁的字都长着羽毛：鸡、鸭、鹅。"],["怎么玩","先把成员字读一遍，再回头找共同点"],["聊一聊","还有哪只鸟朋友住在鸟字旁家里？"],["生活里","去公园认鸟，想想它们的名字怎么写。"]],"g":0},{"type":"family","key":"族足","radical":"足","name":"足字家族","meaning":"带足字旁的字，都要用脚来做。","members":[["跑","跑步"],["跳","跳高"],["踢","踢球"],["路","马路"]],"badge":"徽足","tips":[["家族故事","足就是脚。跑、跳、踢，都要用脚。"],["怎么玩","先把成员字读一遍，再回头找共同点"],["聊一聊","跑、跳、踢——哪个字带足字旁？"],["生活里","楼下玩跑跳踢，回家说这三个字。"]],"g":0},{"type":"family","key":"族虫","radical":"虫","name":"虫字家族","meaning":"带虫字的字，说的都是小虫虫和小动物。","members":[["蚂","蚂蚁"],["蚊","蚊子"],["蜂","蜜蜂"],["蝶","蝴蝶"],["蝉","知了"],["萤","萤火虫"]],"badge":"徽虫","tips":[["家族故事","虫字藏在这些字里，它们都是小虫子。"],["怎么玩","读一个成员字，再用手比出虫子的样子找虫字。"],["聊一聊","你在公园见过哪些小虫子？名字里带虫字吗？"],["生活里","去公园找小虫，看看它的名字带不带虫字。"]],"g":0},{"type":"family","key":"族讠","radical":"讠","name":"言字旁家族","meaning":"带言字旁的字，都和说话有关。","members":[["说","说话"],["请","请坐"],["谢","谢谢"],["记","记住"],["认","认字"],["讲","讲故事"]],"badge":"徽讠","tips":[["家族故事","言字旁像一张小嘴巴，说话、谢谢都从这里出。"],["怎么玩","读一个成员字，再做一做「说」的动作，看谁先想到。"],["聊一聊","今天跟谁说过话了？那些字带言字旁吗？"],["生活里","吃饭前说一声「谢谢」，指指这两个字。"]],"g":0},{"type":"family","key":"族忄","radical":"忄","name":"竖心旁家族","meaning":"带竖心旁的字，说的是心里的小感觉。","members":[["怕","害怕"],["惊","吃惊"],["急","着急"],["忙","帮忙"],["慌","慌张"],["慢","慢走"]],"badge":"徽忄","tips":[["家族故事","竖心旁像心里在跳，怕、急、慌都是心的感觉。"],["怎么玩","做一个表情，说出你是什么感觉，再找带竖心旁的字。"],["聊一聊","今天你心里是什么感觉？害怕还是着急？"],["生活里","害怕的时候抱抱妈妈，说出「怕」字。"]],"g":0},{"type":"family","key":"族犭","radical":"犭","name":"反犬旁家族","meaning":"带反犬旁的字，都是动物朋友。","members":[["猫","小猫"],["狗","小狗"],["猪","小猪"],["猴","猴子"],["狐","狐狸"],["狼","大灰狼"]],"badge":"徽犭","tips":[["家族故事","反犬旁像一只小动物，猫、狗、猴、狐狸都是它朋友。"],["怎么玩","学一学小动物怎么叫，再找找哪个字带反犬旁。"],["聊一聊","你最喜欢哪个动物？它的名字带反犬旁吗？"],["生活里","去动物园，指着动物说出它的名字。"]],"g":0},{"type":"family","key":"族月","radical":"月","name":"肉月旁家族","meaning":"带月字旁的字，说的都是身体上的事。","members":[["脸","笑脸"],["肚","肚子"],["肩","肩膀"],["脖","脖子"],["胸","胸口"],["膝","膝盖"]],"badge":"徽月","tips":[["家族故事","月字旁胖胖的，说起来都是身上的地方。"],["怎么玩","指指自己身上的一块，看看那个字带不带月字旁。"],["聊一聊","你身上哪个地方最爱动？那个字带月字旁吗？"],["生活里","洗澡时指指肚子和脸，说出这两个字。"]],"g":0},{"type":"family","key":"族火","radical":"火","name":"火字旁家族","meaning":"带火字的字，都和火、热有关。","members":[["火","火焰"],["灯","台灯"],["炒","炒菜"],["煮","煮饭"],["烫","很烫"]],"badge":"徽火","tips":[["家族故事","火字旁像小小的火苗，灯、炒、煮都要用火。"],["怎么玩","找一件家里用火做的事，说出它的字。"],["聊一聊","做饭的时候，哪些字带火字旁？"],["生活里","开灯时指指「灯」，说说它带火字旁。"]],"g":0},{"type":"family","key":"族辶","radical":"辶","name":"走之旁家族","meaning":"带走之旁的字，都和走动有关。","members":[["过","过去"],["进","进来"],["送","送给"],["远","远方"],["边","旁边"],["道","马路"]],"badge":"徽辶","tips":[["家族故事","走之旁像一条小尾巴，走、过、进都要迈开腿。"],["怎么玩","读一个成员字，再做一个小走的动作，看它是不是走之旁。"],["聊一聊","今天你走到哪里去了？那个字带走之旁吗？"],["生活里","出门时说「我们走过去」，指指这个字。"]],"g":0},{"type":"family","key":"族米","radical":"米","name":"米字旁家族","meaning":"带米字的字，都是能吃的。","members":[["米","大米"],["糖","糖果"],["粥","喝粥"],["糕","蛋糕"],["粉","面粉"]],"badge":"徽米","tips":[["家族故事","米字旁像一把米粒，糖、粥、糕、粉都是吃的。"],["怎么玩","看桌上的食物，找出带米字的字。"],["聊一聊","今天吃的东西里，哪个字带米字旁？"],["生活里","吃饭时指着米饭，说说「米」字。"]],"g":0},{"type":"family","key":"族钅","radical":"钅","name":"金字旁家族","meaning":"带金字旁的字，都是金属做的。","members":[["钟","时钟"],["铃","铃铛"],["针","针线"],["镜","镜子"],["钉","钉子"]],"badge":"徽钅","tips":[["家族故事","金字旁亮亮的，针、铃、镜子都是金属做的。"],["怎么玩","摸一摸家里的金属物件，看看名字带不带金字旁。"],["聊一聊","家里哪些东西是金属做的？名字带金字旁吗？"],["生活里","看看门上的锁或钥匙，指指「金」字旁。"]],"g":0}];

 transform=\"rotate(-20 384.0 206)\"><ellipse cx=\"384.0\" cy=\"206\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(20 412.0 206)\"><ellipse cx=\"412.0\" cy=\"206\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 352.0 206)\"><ellipse cx=\"352.0\" cy=\"206\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(20 380.0 206)\"><ellipse cx=\"380.0\" cy=\"206\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 408.0 206)\"><ellipse cx=\"408.0\" cy=\"206\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(20 436.0 206)\"><ellipse cx=\"436.0\" cy=\"206\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 388.0 218)\"><ellipse cx=\"388.0\" cy=\"218\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(20 416.0 218)\"><ellipse cx=\"416.0\" cy=\"218\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 444.0 218)\"><ellipse cx=\"444.0\" cy=\"218\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 334.0 184)\"><ellipse cx=\"334.0\" cy=\"184\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(20 362.0 184)\"><ellipse cx=\"362.0\" cy=\"184\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 390.0 184)\"><ellipse cx=\"390.0\" cy=\"184\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 358.0 174)\"><ellipse cx=\"358.0\" cy=\"174\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(20 386.0 174)\"><ellipse cx=\"386.0\" cy=\"174\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 414.0 174)\"><ellipse cx=\"414.0\" cy=\"174\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 378.0 184)\"><ellipse cx=\"378.0\" cy=\"184\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(20 406.0 184)\"><ellipse cx=\"406.0\" cy=\"184\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><g transform=\"rotate(-20 434.0 184)\"><ellipse cx=\"434.0\" cy=\"184\" rx=\"16\" ry=\"8\" fill=\"#f7ae35\"/></g><path d=\"M 296 300 Q 380 314 464 300 Q 460 332 380 334 Q 300 332 296 300 Z\" fill=\"#d9734f\"/>","族钅":"<circle cx=\"380\" cy=\"240\" r=\"168\" fill=\"#c08a3e\"/><circle cx=\"380\" cy=\"240\" r=\"146\" fill=\"#fdf8ec\"/><path d=\"M 238 268 C 248 236 268 226 288 236 C 320 284 440 284 472 236 C 492 226 512 236 522 268 C 512 330 458 350 380 350 C 302 350 248 330 238 268 Z\" fill=\"#f7ae35\"/><path d=\"M 292 252 C 324 292 436 292 468 252\" fill=\"none\" stroke=\"#d99a2b\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"338\" cy=\"314\" rx=\"30\" ry=\"11\" fill=\"#f9c95e\" opacity=\"0.8\"/><ellipse cx=\"428\" cy=\"318\" rx=\"18\" ry=\"8\" fill=\"#f9c95e\" opacity=\"0.6\"/>"};
    const ACCENT = "#5f8f52";
    const TINT = "#e4e7d3";
    const TITLE = "部首家族 · 找朋友";
    const SUB = "一个部首是一家人——发现规律，学会猜字";
    const INK = "#4a3226", MUTED = "#8d7d73", CREAM = "#fdf8ec";
    const SONG = "'Songti SC','STSong','SimSun',serif";

    const qs = new URLSearchParams(location.search);
    const gridAll = qs.has("grid");
    const groupParam = qs.get("group");
    const mode = gridAll ? "grid" : (qs.has("n") ? "static" : "deck");
    const state = { i: 0, revealed: qs.get("reveal") === "1" };

    let deck = CARDS.map((c, i) => ({ c, i }));
    if (groupParam) {
      const gi = GROUPS.findIndex((g) => g.id === groupParam);
      if (gi >= 0) deck = deck.filter((d) => d.c.g === gi);
    }

    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function glyphPath(ch, cx, cy, s) {
      const g = GLYPHS[ch];
      if (!g) return "";
      return `<path d="${g.d}" transform="translate(${(cx - s * g.bx).toFixed(2)},${(cy + s * g.by).toFixed(2)}) scale(${s},${-s})" fill="${INK}"/>`;
    }

    function txt(x, y, size, fill, content, weight = 600, family = SONG, ls = 0, anchor = "middle") {
      return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="${weight}" fill="${fill}" font-family="${family}"${ls ? ` letter-spacing="${ls}"` : ""}>${content}</text>`;
    }

    function band(x, y, w, h, rx, fill) { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}"/>`; }

    function wrapLines(s, width) {
      s = s.trim();
      const lines = [];
      while (s.length > width) {
        let cut = width;
        while (cut < s.length && /[，。；！？、～]/.test(s[cut])) cut++;
        lines.push(s.slice(0, cut));
        s = s.slice(cut).trim();
      }
      if (s) lines.push(s);
      return lines;
    }

    function frame() {
      return `<rect x="10" y="10" width="780" height="980" rx="42" fill="${CREAM}" stroke="${ACCENT}" stroke-width="10"/>`;
    }

    // ---------- 象形字：看图猜字 ----------
    function cardPic(c, revealed) {
      let s = frame();
      s += `<g transform="translate(20,84)">${ART[c.key]}</g>`;
      if (!revealed) {
        s += band(96, 600, 608, 156, 34, TINT);
        s += txt(400, 668, 46, INK, "这是哪个字呀？", 700);
        s += txt(400, 718, 27, MUTED, "想一想，再点下面的按钮翻开", 500, "system-ui,-apple-system,sans-serif");
      } else {
        s += txt(400, 630, 30, ACCENT, `${esc(c.pinyin)} · ${esc(c.tone)}`, 700, "system-ui,-apple-system,sans-serif");
        s += glyphPath(c.char, 400, 758, 0.24);
        s += band(110, 878, 580, 84, 26, TINT);
        const lines = wrapLines(c.story, 14);
        if (lines.length === 1) s += txt(400, 930, 30, INK, esc(lines[0]), 600);
        else { s += txt(400, 912, 27, INK, esc(lines[0]), 600); s += txt(400, 946, 27, INK, esc(lines[1]), 600); }
      }
      return s;
    }

    // ---------- 会意字：拼字魔法 ----------
    function cardMagic(c, revealed) {
      let s = frame();
      const n = c.parts.length;
      const tileW = n === 2 ? 196 : 150, gap = 42;
      const x0 = 400 - (n * tileW + (n - 1) * gap) / 2;
      c.parts.forEach((p, i) => {
        const tx = x0 + i * (tileW + gap);
        s += band(tx, 82, tileW, 214, 30, TINT);
        s += glyphPath(p[0], tx + tileW / 2, 166, n === 2 ? 0.15 : 0.115);
        s += txt(tx + tileW / 2, 264, 25, MUTED, esc(p[1]), 500, "system-ui,-apple-system,sans-serif");
        if (i < n - 1) s += txt(tx + tileW + gap / 2, 208, 62, ACCENT, "＋", 800);
      });
      s += band(140, 316, 520, 66, 33, TINT);
      s += txt(400, 359, 33, INK, "拼在一起，是什么字？", 700);
      s += band(96, 408, 608, 546, 36, "#fbf3e2");
      if (!revealed) {
        s += txt(400, 706, 150, "#dccfae", "？", 800);
        s += txt(400, 836, 29, MUTED, "先猜一猜，再点「变！」", 500, "system-ui,-apple-system,sans-serif");
      } else {
        s += `<g transform="translate(58,440) scale(0.9)">${ART[c.key]}</g>`;
        s += `<circle cx="656" cy="522" r="104" fill="${CREAM}" stroke="${ACCENT}" stroke-width="8"/>`;
        s += glyphPath(c.result, 656, 528, 0.175);
        s += txt(656, 658, 27, ACCENT, esc(c.pinyin), 700, "system-ui,-apple-system,sans-serif");
        s += band(92, 890, 616, 84, 26, TINT);
        const lines = wrapLines(c.story, 15);
        if (lines.length === 1) s += txt(400, 942, 30, INK, esc(lines[0]), 600);
        else { s += txt(400, 924, 27, INK, esc(lines[0]), 600); s += txt(400, 958, 27, INK, esc(lines[1]), 600); }
      }
      return s;
    }

    // ---------- 部首家族：找朋友 ----------
    function cardFamily(c) {
      let s = frame();
      s += `<g transform="translate(28,54) scale(0.5)">${ART[c.key]}</g>`;
      s += `<circle cx="588" cy="176" r="118" fill="#f7dfa0"/><circle cx="588" cy="176" r="100" fill="#fdf3cf"/>`;
      s += glyphPath(c.radical, 588, 182, 0.21);
      s += txt(400, 372, 50, ACCENT, esc(c.name), 800);
      s += txt(400, 428, 29, "#6b5a4e", esc(c.meaning), 500, "system-ui,-apple-system,sans-serif");
      const n = c.members.length;
      const cols = Math.min(4, Math.ceil(n / 2)), rows = Math.ceil(n / cols);
      const cellW = 680 / cols, cellH = 400 / rows;
      const gs = cols >= 4 ? 0.135 : (cols === 3 ? 0.15 : 0.15);
      c.members.forEach((m, i) => {
        const row = Math.floor(i / cols), col = i % cols;
        const rowN = row === rows - 1 ? n - (rows - 1) * cols : cols;
        const cx = 60 + cellW * col + cellW / 2 + (680 - rowN * cellW) / 2;
        const cy = 470 + row * cellH;
        s += band(cx - cellW / 2 + 8, cy + 8, cellW - 16, cellH - 16, 22, TINT);
        s += glyphPath(m[0], cx, cy + cellH / 2 - 12, gs);
        s += txt(cx, cy + cellH - 16, 24, "#6b5a4e", esc(m[1]), 500, "system-ui,-apple-system,sans-serif");
      });
      s += band(90, 894, 620, 72, 24, TINT);
      const q = wrapLines(c.tips[2][1], 20);
      if (q.length === 1) s += txt(400, 938, 26, INK, esc(q[0]), 500);
      else { s += txt(400, 922, 23, INK, esc(q[0]), 500); s += txt(400, 952, 23, INK, esc(q[1]), 500); }
      return s;
    }

    // ---------- 韵语与声音游戏 ----------
    function cardVerse(c) {
      let s = frame();
      s += txt(400, 104, 48, ACCENT, esc(c.title), 800);
      s += `<line x1="330" y1="130" x2="470" y2="130" stroke="${TINT}" stroke-width="6" stroke-linecap="round"/>`;
      c.lines.forEach((line, i) => {
        const m = line.match(/^(.*)([\u4e00-\u9fff])([，。；！？]?)$/);
        const y = 210 + i * 96;
        if (m) {
          s += txt(400, y, 58, INK, esc(m[1]) + `<tspan fill="${ACCENT}">${esc(m[2])}</tspan>` + esc(m[3]), 700, SONG, 5);
        } else {
          s += txt(400, y, 58, INK, esc(line), 700, SONG, 5);
        }
      });
      s += `<g transform="translate(210,668) scale(0.5)">${ART[c.key]}</g>`;
      s += txt(400, 948, 26, MUTED, "句尾的字，结尾声音很像哦", 500, "system-ui,-apple-system,sans-serif");
      return s;
    }

    function cardGame(c) {
      let s = frame();
      s += txt(400, 104, 48, ACCENT, esc(c.title), 800);
      s += `<line x1="330" y1="130" x2="470" y2="130" stroke="${TINT}" stroke-width="6" stroke-linecap="round"/>`;
      c.steps.forEach((st, i) => {
        const y = 196 + i * 78;
        s += `<circle cx="152" cy="${y - 11}" r="23" fill="${ACCENT}"/>`;
        s += txt(152, y - 2, 25, "#fff", String(i + 1), 700, "system-ui,-apple-system,sans-serif");
        s += txt(192, y, 32, INK, esc(st), 600, SONG, 1, "start");
      });
      s += `<g transform="translate(202,472) scale(0.52)">${ART[c.key]}</g>`;
      s += band(255, 774, 290, 56, 28, TINT);
      s += txt(400, 811, 26, "#6b5a4e", "和爸爸妈妈一起玩", 500, "system-ui,-apple-system,sans-serif");
      return s;
    }

    function cardSVG(card, revealed) {
      const inner = KIND === "pic" ? cardPic(card, revealed)
        : KIND === "magic" ? cardMagic(card, revealed)
        : KIND === "family" ? cardFamily(card)
        : card.type === "verse" ? cardVerse(card)
        : cardGame(card);
      return `<svg viewBox="0 0 800 1000" role="img" aria-label="${esc(card.key)}" class="card-svg">${inner}</svg>`;
    }

    const LEADS = {
      pic: "先让孩子看图猜一猜，再翻开验证；翻开前别提示。",
      magic: "先遮着答案让孩子猜，再点「变！」揭晓；猜错也是好机会。",
      family: "这一套是讲解卡：先认部首，再把家族成员读一遍。",
      shengyin: "这一套玩声音：重点是耳朵和嘴巴，不要求认字。",
    };

    function tipsHTML(card) {
      let h = `<div class="lead">${LEADS[KIND] || ""}</div>`;
      (card.tips || []).forEach((row) => {
        h += `<div class="tip-row"><span class="tip-tag">${esc(row[0])}</span><span>${esc(row[1])}</span></div>`;
      });
      return h;
    }

    const cardWrap = document.getElementById("cardWrap");
    const counter = document.getElementById("counter");
    const groupName = document.getElementById("groupName");
    const tips = document.getElementById("tips");
    const primaryBtn = document.getElementById("primaryBtn");
    const toggleTips = document.getElementById("toggleTips");
    const sheetWrap = document.getElementById("sheetWrap");
    const sheetGrid = document.getElementById("sheetGrid");
    const bar = document.getElementById("bar");
    const groupBtn = document.getElementById("groupBtn");
    const hasPrimary = KIND === "pic" || KIND === "magic";
    const multiGroup = GROUPS.length > 1;

    const PRIMARY_LABEL = { pic: ["翻开字", "藏起字"], magic: ["变！", "收起来"] };

    function render() {
      if (mode === "deck" && deskActive) return renderDesk();
      const { c, i } = deck[state.i];
      const shown = mode === "grid" ? true : state.revealed;
      cardWrap.innerHTML = cardSVG(c, shown);
      groupName.textContent = GROUPS[c.g].name;
      const inGroup = CARDS.filter((x) => x.g === c.g).length;
      const pos = CARDS.filter((x, idx) => x.g === c.g && idx <= i).length;
      counter.textContent = `${pos} / ${inGroup}`;
      if (hasPrimary) {
        const [on, off] = PRIMARY_LABEL[KIND];
        primaryBtn.textContent = state.revealed ? off : on;
        primaryBtn.setAttribute("aria-pressed", String(state.revealed));
      }
      document.querySelectorAll(".chip").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.g) === c.g);
      });
      if (mode === "deck") saveLastPos();
    }

    function go(delta) {
      state.i = (state.i + delta + deck.length) % deck.length;
      state.revealed = false;
      closeTips();
      render();
    }

    function jumpTo(gi) {
      const at = deck.findIndex((d) => d.c.g === gi);
      if (at >= 0) { state.i = at; state.revealed = false; closeTips(); render(); }
    }

    function closeTips() {
      tips.hidden = true;
      toggleTips.setAttribute("aria-pressed", "false");
    }

    function openSheet() {
      sheetWrap.hidden = false;
      const act = document.querySelector(".chip.active");
      if (act) act.scrollIntoView({ block: "center" });
    }
    function closeSheet() { sheetWrap.hidden = true; }

    // 飞书等容器会在 touchend 上 preventDefault 吞掉合成 click，按钮动作直接绑 touchend。
    function bindTap(el, fn) {
      let sx = 0, sy = 0;
      el.addEventListener("touchstart", (e) => {
        const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY;
      }, { passive: true });
      el.addEventListener("touchend", (e) => {
        const t = e.changedTouches[0];
        if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) return;
        e.preventDefault();
        fn(e);
      }, { passive: false });
      el.addEventListener("click", fn);
    }

    if (hasPrimary) bindTap(primaryBtn, () => { state.revealed = !state.revealed; render(); });
    bindTap(toggleTips, () => {
      const open = tips.hidden;
      if (open) { tips.innerHTML = tipsHTML(deck[state.i].c); tips.hidden = false; }
      else closeTips();
      toggleTips.setAttribute("aria-pressed", String(open));
    });
    if (multiGroup) groupBtn.addEventListener("click", openSheet);
    bindTap(document.getElementById("sheetBackdrop"), closeSheet);
    sheetGrid.addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (b) { jumpTo(Number(b.dataset.g)); closeSheet(); }
    });
    sheetGrid.addEventListener("touchend", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      e.preventDefault();
      jumpTo(Number(b.dataset.g));
      closeSheet();
    }, { passive: false });

    function cycleGroup(dir) {
      const next = (deck[state.i].c.g + dir + GROUPS.length) % GROUPS.length;
      jumpTo(next);
      groupBtn.classList.add("flash");
      setTimeout(() => groupBtn.classList.remove("flash"), 240);
    }
    let barTouch = null;
    const edgeSwipe = (x) => x < 28 || x > innerWidth - 28;   // 屏幕左右边缘是系统返回手势区，不当翻页
    bar.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      if (edgeSwipe(t.clientX)) { barTouch = null; return; }
      barTouch = { x: t.clientX, y: t.clientY, onGroup: !!(e.target.closest && e.target.closest("#groupBtn")) };
    }, { passive: true });
    bar.addEventListener("touchend", (e) => {
      if (!barTouch || mode !== "deck") { barTouch = null; return; }
      const t = e.changedTouches[0];
      const dx = t.clientX - barTouch.x, dy = t.clientY - barTouch.y;
      const onGroup = barTouch.onGroup;
      barTouch = null;
      const horiz = Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy) * 1.4;
      const isTap = Math.abs(dx) <= 12 && Math.abs(dy) <= 12;
      if (onGroup && multiGroup) {
        if (horiz) { e.stopPropagation(); e.preventDefault(); cycleGroup(dx < 0 ? 1 : -1); }
        else if (isTap) { e.preventDefault(); openSheet(); }
        return;
      }
      if (horiz) { e.stopPropagation(); e.preventDefault(); go(dx < 0 ? 1 : -1); }
    }, { passive: false });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
      if (e.key === "Escape") closeSheet();
    });

    let touchX = null, touchY = null;
    document.addEventListener("touchstart", (e) => {
      if (e.target.closest && e.target.closest(".bar")) { touchX = null; return; }
      if (edgeSwipe(e.touches[0].clientX)) { touchX = null; return; }   // 边缘滑动多为系统返回/退出，不翻页
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (touchX === null || mode !== "deck" || (e.target.closest && e.target.closest(".bar"))) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    document.getElementById("head").innerHTML =
      `<a class="home-btn" href="index.html" aria-label="返回首页">🏠<span> 首页</span></a><span class="t">${esc(TITLE)}</span><span class="s">${esc(SUB)}</span>`;

    // ════════     // 记住上次看到的位置：任何入口都记录；带 ?from=hub 从首页进入时恢复。
    const DECK_META = (() => {
      const m = { pic: ["xiangxing", "象形字 · 看图猜字"], magic: ["huiyi", "会意字 · 拼字魔法"],
                  family: ["bushou", "部首家族 · 找朋友"], shengyin: ["yunyu", "韵语与声音游戏"] }[KIND];
      return m ? { id: m[0], url: m[0] + ".html", name: m[1] } : null;
    })();
    function saveLastPos() {
      if (mode !== "deck" || !DECK_META || deck.length !== CARDS.length) return;
      const { c, i } = deck[state.i];
      const label = KIND === "pic" ? c.char : KIND === "magic" ? c.result : KIND === "family" ? c.radical : c.title;
      const inGroup = CARDS.filter((x) => x.g === c.g).length;
      const pos = CARDS.filter((x, idx) => x.g === c.g && idx <= i).length + "/" + inGroup;
      try {
        localStorage.setItem("hz.deck." + DECK_META.id, JSON.stringify({ i: state.i, ts: Date.now() }));
        localStorage.setItem("hz.last", JSON.stringify({ id: DECK_META.id, url: DECK_META.url, name: DECK_META.name, label: label, pos: pos, ts: Date.now() }));
      } catch (e) {}
    }

    // ════════ 宽屏三栏版（≥960px；手机竖屏/窄竖屏走原布局，零改动） ════════
    const deskMQ = window.matchMedia("(min-width: 960px), (min-width: 880px) and (hover: hover) and (pointer: fine)");
    let deskActive = false;
    function updateDeskMode() {
      if (mode !== "deck") return;
      const want = deskMQ.matches;
      if (want === deskActive) return;
      deskActive = want;
      document.getElementById("desk").hidden = !want;
      document.body.classList.toggle("desk-on", want);
      if (want) cardWrap.innerHTML = "";
    }
    const dEl = (id) => document.getElementById(id);
    function artSVG(key, vb) {
      return `<svg viewBox="0 0 ${vb || "760 480"}" preserveAspectRatio="xMidYMid meet" aria-label="插画">${ART[key] || ""}</svg>`;
    }
    function glyphSVG(ch, size, s) {
      const vb = size;
      return `<svg viewBox="0 0 ${vb} ${vb}">${glyphPath(ch, vb / 2, vb / 2 + s * 40, s)}</svg>`;
    }
    function boardSVG(inner) {
      return `<svg viewBox="0 0 600 600"><rect x="6" y="6" width="588" height="588" rx="36" fill="#fffdf3" stroke="#e3d3a8" stroke-width="4"/>${inner}</svg>`;
    }
    const qMark = () => boardSVG(txt(300, 392, 170, "#dccfae", "？", 800) + txt(300, 520, 26, "#b0a49a", "点一下揭晓", 500, "system-ui,-apple-system,sans-serif"));

    function deskLeftHTML(c, shown) {
      if (KIND === "pic") {
        return `<div class="art-area">${artSVG(c.key)}</div>
          <div class="desk-pill ${shown ? "" : "q"}">${shown ? esc(c.story) : "这是哪个字呀？想一想，再点中间翻开"}</div>`;
      }
      if (KIND === "magic") {
        const tiles = c.parts.map((p) =>
          `<div class="part-tile">${glyphSVG(p[0], 120, 0.095)}<div class="pl">${esc(p[1])}</div></div>`)
          .join(`<div class="parts-plus">＋</div>`);
        const below = shown
          ? `<div class="art-area">${artSVG(c.key)}</div>`
          : `<div class="art-area">${qMark()}</div>`;
        return `<div class="parts-row">${tiles}</div>${below}
          <div class="desk-pill q">${shown ? esc(c.story) : "拼在一起，是什么字？"}</div>`;
      }
      if (KIND === "family") {
        return `<div class="art-area">${artSVG(c.key)}</div>
          <div class="desk-pill">${esc(c.name)} · ${esc(c.meaning)}</div>`;
      }
      return `<div class="art-area">${artSVG(c.key)}</div>`;
    }

    function deskCenterHTML(c, shown) {
      if (KIND === "pic") {
        if (!shown) return `<div class="board">${qMark()}</div><div class="hint">点击卡片${state.revealed ? "藏起" : "翻开"}</div>`;
        return `<div class="board">${boardSVG(
          txt(300, 96, 34, "#3e9486", esc(c.pinyin) + " · " + esc(c.tone), 700, "system-ui,-apple-system,sans-serif") +
          glyphPath(c.char, 300, 350, 0.34))}</div><div class="hint">点击卡片藏起</div>`;
      }
      if (KIND === "magic") {
        if (!shown) return `<div class="board">${qMark()}</div><div class="hint">点击「变！」揭晓答案</div>`;
        return `<div class="board">${boardSVG(
          txt(300, 96, 34, "#3e9486", esc(c.pinyin), 700, "system-ui,-apple-system,sans-serif") +
          glyphPath(c.result, 300, 350, 0.30))}</div><div class="hint">点击卡片收起来</div>`;
      }
      if (KIND === "family") {
        return `<div class="board">${boardSVG(
          `<circle cx="300" cy="300" r="196" fill="#f7dfa0"/><circle cx="300" cy="300" r="168" fill="#fdf3cf"/>` +
          glyphPath(c.radical, 300, 312, 0.30) +
          txt(300, 552, 40, "#b0772f", esc(c.name), 800) +
          txt(300, 596, 24, "#6b5a4e", esc(c.meaning), 500, "system-ui,-apple-system,sans-serif"))}</div>`;
      }
      if (c.type === "verse") {
        const lines = c.lines.map((line) => {
          const m = line.match(/^(.*)([\u4e00-\u9fff])([，。；！？]?)$/);
          return m ? `<div class="vl">${esc(m[1])}<b>${esc(m[2])}</b>${esc(m[3])}</div>` : `<div class="vl">${esc(line)}</div>`;
        }).join("");
        return `<div class="verse-box"><div class="vt">${esc(c.title)}</div>${lines}</div>`;
      }
      const steps = c.steps.map((st, i) =>
        `<div class="step-row"><div class="step-n">${i + 1}</div><div class="step-t">${esc(st)}</div></div>`).join("");
      return `<div class="steps-box"><div class="vt">${esc(c.title)}</div>${steps}</div>`;
    }

    function deskPanelHTML(c) {
      const shown = state.revealed;
      let head = "";
      if (KIND === "pic") head = `<div class="desk-head"><span class="zi">${shown ? esc(c.char) : "？"}</span><span class="meta">${esc(GROUPS[c.g].name)} · 卡 ${deskPos()} / ${deskInGroup()}</span></div>`;
      else if (KIND === "magic") head = `<div class="desk-head"><span class="zi">${shown ? esc(c.result) : "？"}</span><span class="meta">${esc(GROUPS[c.g].name)} · 卡 ${deskPos()} / ${deskInGroup()}</span></div>`;
      else if (KIND === "family") head = `<div class="desk-head"><span class="zi">${esc(c.radical)}</span><span class="meta">${esc(c.name)}</span></div>`;
      else head = `<div class="desk-head"><span class="zi">${esc(c.title)}</span><span class="meta">${esc(GROUPS[c.g].name)}</span></div>`;
      let members = "";
      if (KIND === "family") {
        members = `<div class="mgrid">` + c.members.map((m) =>
          `<div class="mcell"><span class="mc">${esc(m[0])}</span><span class="mw">${esc(m[1])}</span></div>`).join("") + `</div>`;
      }
      let story = "";
      if ((KIND === "pic" || KIND === "magic") && shown) story = "";
      return head + tipsHTML(c) + members;
    }

    function deskPos() {
      const { c, i } = deck[state.i];
      return CARDS.filter((x, idx) => x.g === c.g && idx <= i).length;
    }
    function deskInGroup() { return CARDS.filter((x) => x.g === deck[state.i].c.g).length; }

    function deskLabel(c) {
      if (KIND === "pic") return c.char;
      if (KIND === "magic") return c.result;
      if (KIND === "family") return c.radical;
      return { label: c.title, wide: true };
    }

    function renderDesk() {
      const { c } = deck[state.i];
      const shown = state.revealed;
      dEl("deskTitle").innerHTML = `${esc(TITLE)}<span class="s">${esc(SUB)}</span>`;
      if (multiGroup) {
        dEl("deskChips").hidden = false;
        dEl("deskChips").innerHTML = GROUPS.map((g, gi) =>
          `<button class="dchip${gi === c.g ? " active" : ""}" data-g="${gi}">${esc(g.name)}</button>`).join("");
      }
      const st = dEl("deskState");
      if (hasPrimary) {
        st.hidden = false;
        st.textContent = shown ? (KIND === "pic" ? "藏起字" : "收起来") : (KIND === "pic" ? "翻开字" : "变！");
      } else st.hidden = true;
      dEl("deskLeft").innerHTML = deskLeftHTML(c, shown);
      dEl("deskCenter").innerHTML = deskCenterHTML(c, shown);
      dEl("deskPanel").innerHTML = deskPanelHTML(c);
      dEl("deskFilm").innerHTML = deck.map((d, i) => {
        if (d.c.g !== c.g) return "";
        const L = deskLabel(d.c);
        const wide = typeof L === "object";
        return `<button class="mini${i === state.i ? " active" : ""}${wide ? " wide" : ""}" data-i="${i}">${esc(wide ? L.label : L)}</button>`;
      }).join("");
      dEl("deskCounter").textContent = `${deskPos()} / ${deskInGroup()} · ${esc(GROUPS[c.g].name)}`;
      const act = document.querySelector("#deskFilm .mini.active");
      if (act) act.scrollIntoView({ block: "nearest", inline: "center" });
      saveLastPos();
    }

    if (mode === "deck") {
      dEl("deskPrev").addEventListener("click", () => go(-1));
      dEl("deskNext").addEventListener("click", () => go(1));
      dEl("deskFilm").addEventListener("click", (e) => {
        const b = e.target.closest(".mini");
        if (b) { state.i = Number(b.dataset.i); state.revealed = false; render(); }
      });
      dEl("deskChips").addEventListener("click", (e) => {
        const b = e.target.closest(".dchip");
        if (b) jumpTo(Number(b.dataset.g));
      });
      dEl("deskCenter").addEventListener("click", () => { if (hasPrimary) { state.revealed = !state.revealed; render(); } });
      dEl("deskState").addEventListener("click", () => { if (hasPrimary) { state.revealed = !state.revealed; render(); } });
      if (window.matchMedia) deskMQ.addEventListener("change", () => { updateDeskMode(); render(); });
    }

    if (mode === "deck") {
      sheetGrid.innerHTML = GROUPS.map((g, gi) =>
        `<button class="chip" data-g="${gi}" aria-label="跳到${g.name}组">${g.name}</button>`).join("");
      if (groupParam) {
        const gi = GROUPS.findIndex((g) => g.id === groupParam);
        if (gi >= 0) state.i = Math.max(0, deck.findIndex((d) => d.c.g === gi));
      }
      if (qs.get("from") === "hub" && DECK_META) {
        try {
          const s = JSON.parse(localStorage.getItem("hz.deck." + DECK_META.id) || "null");
          if (s && deck.length === CARDS.length && s.i >= 0 && s.i < deck.length) state.i = s.i;
        } catch (e) {}
      }
      const nParam = parseInt(qs.get("n"), 10);
      if (nParam >= 1 && nParam <= deck.length) state.i = nParam - 1;
      updateDeskMode();
      render();
      if (qs.get("tips") === "1") {
        tips.innerHTML = tipsHTML(deck[state.i].c);
        tips.hidden = false;
        toggleTips.setAttribute("aria-pressed", "true");
      }
      if (qs.get("sheet") === "1") openSheet();
      if (!multiGroup) { groupBtn.style.display = "none"; }
      if (!hasPrimary) { primaryBtn.style.display = "none"; }
    } else if (mode === "grid") {
      document.body.classList.add("grid");
      document.getElementById("stage").innerHTML = deck.map((d) => cardSVG(d.c, true)).join("");
    } else {
      document.body.classList.add("static");
      const nParam = parseInt(qs.get("n"), 10);
      state.i = Math.max(0, Math.min(deck.length - 1, (nParam || 1) - 1));
      render();
    }
  </script>
</body>
</html>
