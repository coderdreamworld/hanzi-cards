<script>
const CARDS = __CARDS__;
const GROUPS = __GROUPS__;
const ART = __ART__;
const AUD = __AUD__;
const VER = "__VER__";
const qs = new URLSearchParams(location.search);
const mode = qs.has('grid') ? 'grid' : qs.has('n') ? 'static' : 'deck';
const state = {i:0,tipsOpen:false};
const byId = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let deck = CARDS.map((c,i)=>({c,i}));
const groupParam = qs.get('group');
if(groupParam){const gi=GROUPS.findIndex(g=>g.id===groupParam);if(gi>=0)deck=deck.filter(d=>d.c.g===gi)}
const take = Number(qs.get('limit'));
if(take>0)deck=deck.slice(Number(qs.get('offset'))||0,(Number(qs.get('offset'))||0)+take);
const audioEl = byId('player');
let audioGeneration=0, audioCancel=null, busyBtn=null, statusTimer=0;
function audioStatus(text){clearTimeout(statusTimer);byId('audioStatus').textContent=text;byId('audioStatus').hidden=!text;if(text)statusTimer=setTimeout(()=>{byId('audioStatus').hidden=true},3500)}
function clearMarks(){document.querySelectorAll('.lt.on').forEach(el=>el.classList.remove('on'))}
function markLetter(li){clearMarks();document.querySelectorAll(`.lt[data-li="${li}"]`).forEach(el=>el.classList.add('on'))}
function stopAudio(){audioGeneration++;audioEl.pause();if(audioCancel)audioCancel();audioCancel=null;audioEl.onended=null;audioEl.onerror=null;if(busyBtn)busyBtn.classList.remove('audio-busy');busyBtn=null;clearMarks()}
function wordUrl(card){return `audio/en_${card.key.toLowerCase().replace(/ /g,'-')}_w.m4a?v=${VER}`}
function clip(url,generation){return new Promise(resolve=>{
 if(generation!==audioGeneration){resolve(false);return}
 let finished=false;const end=ok=>{if(finished)return;finished=true;audioEl.onended=null;audioEl.onerror=null;audioCancel=null;resolve(ok)};
 audioCancel=()=>end(false);audioEl.src=url;audioEl.onended=()=>end(true);audioEl.onerror=()=>{audioStatus('音频暂时无法播放，请再点一次。');end(false)};
 audioEl.play().catch(error=>{if(generation!==audioGeneration){end(false);return}if(error.name==='NotAllowedError')audioStatus('点「单词」开始听读。');else if(error.name!=='AbortError')audioStatus('音频暂时无法播放，请再点一次。');end(false)});
})}
async function playWord(card=deck[state.i].c){stopAudio();const generation=audioGeneration;busyBtn=byId(deskActive?'deskPlayW':'playWord');busyBtn.classList.add('audio-busy');await clip(wordUrl(card),generation);if(generation===audioGeneration){busyBtn?.classList.remove('audio-busy');busyBtn=null}}
async function playSpell(card=deck[state.i].c){stopAudio();const generation=audioGeneration;busyBtn=byId(deskActive?'deskPlayS':'playSpell');busyBtn.classList.add('audio-busy');let li=0;
 for(const ch of card.w){if(!/[A-Za-z]/.test(ch))continue;markLetter(li++);if(!await clip(`audio/en_letter_${ch.toLowerCase()}.m4a?v=${VER}`,generation))break}
 if(generation===audioGeneration){clearMarks();await clip(wordUrl(card),generation)}
 if(generation===audioGeneration){busyBtn?.classList.remove('audio-busy');busyBtn=null;clearMarks()}
}
function letterRows(word){let li=0;return word.split(' ').map(w=>[...w].map(ch=>({ch:ch.toUpperCase(),li:/[a-z]/i.test(ch)?li++:-1})))}
function rowsSVG(rows){const nr=rows.length,ph=nr===1?206:nr===2?240:286;let html='';rows.forEach((row,ri)=>{
 const fs=Math.min(nr===1?148:80,650/row.length*1.02);const y=46+ph*(ri+.5)/nr;
 row.forEach((c,i)=>{html+=`<text class="lt" ${c.li>=0?`data-li="${c.li}"`:''} x="${58+(i+.5)*684/row.length}" y="${y}" dominant-baseline="central" text-anchor="middle" font-size="${c.li<0?fs*.6:fs}" font-weight="800" font-family="'Avenir Next',system-ui,sans-serif">${esc(c.ch)}</text>`})
 });return html}
function cardSVG(card){const rows=letterRows(card.w),ph=rows.length===1?206:rows.length===2?240:286;const artY=46+ph+12,scale=Math.min(1,(766-artY)/480);const fs=Math.min(76,1180/Math.max(6,card.w.length));return `<svg class="card-svg" viewBox="0 0 800 1000" role="img" aria-label="${esc(card.w)} 英语单词卡" data-key="${esc(card.key)}"><rect x="10" y="10" width="780" height="980" rx="42" fill="#fdf8ec" stroke="#f2c14e" stroke-width="10"/><rect x="46" y="46" width="708" height="${ph}" rx="34" fill="#fbf0c2"/>${rowsSVG(rows)}<svg class="art" x="20" y="${artY}" width="760" height="${480*scale}" viewBox="0 0 760 480" overflow="hidden">${ART[card.key]}</svg><g class="wpanel"><rect x="46" y="792" width="708" height="174" rx="34" fill="#d9f0ea"/><text class="whole-word" x="400" y="${850+fs*.15}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#4a3226" font-family="'Avenir Next',system-ui,sans-serif">${esc(card.w)}</text><text x="400" y="930" text-anchor="middle" font-size="34" fill="#786b62">${esc(card.cn)}</text></g></svg>`}
const DECK_META={id:'en-words',url:'english-words.html',name:'英语单词卡'};
let saveTimer=0,navigated=false;
function queueSave(){clearTimeout(saveTimer);if(mode!=='deck'||deck.length!==CARDS.length||!navigated)return;const expected=deck[state.i].c.key;saveTimer=setTimeout(()=>{if(document.hidden||deck[state.i].c.key!==expected)return;const{c,i}=deck[state.i];const total=CARDS.filter(x=>x.g===c.g).length;const pos=CARDS.slice(0,i+1).filter(x=>x.g===c.g).length;try{localStorage.setItem('hz.deck.'+DECK_META.id,JSON.stringify({i:state.i,key:c.key,ts:Date.now()}));localStorage.setItem('hz.last',JSON.stringify({...DECK_META,label:GROUPS[c.g].name+' · '+c.w,pos:`${pos}/${total}`,ts:Date.now()}))}catch(e){}},1500)}
const deskMQ=matchMedia('(min-width:960px)');let deskActive=false;
function updateDeskMode(){deskActive=mode==='deck'&&deskMQ.matches;byId('desk').hidden=!deskActive;document.body.classList.toggle('desk-on',deskActive)}
function stats(){const{c}=deck[state.i];const entries=deck.filter(d=>d.c.g===c.g);return{total:entries.length,pos:entries.findIndex(d=>d.c.key===c.key)+1}}
function render(){if(!deck.length)return;stopAudio();const c=deck[state.i].c;const{pos,total}=stats();const group=GROUPS[c.g];
 byId('groupName').textContent=group.name;byId('counter').textContent=`${pos} / ${total}`;
 if(deskActive){byId('cardWrap').innerHTML='';byId('deskArtSvg').innerHTML=ART[c.key];const longest=Math.max(...c.w.split(' ').map(w=>w.length));byId('deskLetters').style.fontSize=`clamp(18px,${Math.min(4.4,29/longest)}vw,58px)`;byId('deskLetters').innerHTML=letterRows(c.w).map(row=>'<span class="lrow">'+row.map(l=>`<span class="lt" ${l.li>=0?`data-li="${l.li}"`:''}>${esc(l.ch)}</span>`).join('')+'</span>').join('');byId('deskWord').textContent=c.w;byId('deskWord').style.fontSize=`clamp(23px,${Math.min(4.6,45/c.w.length)}vw,64px)`;byId('deskCn').textContent=c.cn;
 byId('deskPanel').innerHTML=`<h2>${esc(c.w)}</h2><p><span class="label">中文</span> ${esc(c.cn)}</p><p><span class="label">主题</span> ${esc(group.name)}<br>${esc(group.en)}</p><p>第 ${pos} / ${total} 张 · 全集 ${CARDS.length} 词条</p><p>先看图猜词，再听单词。<br>「拼读」逐个读字母名，最后读整词。</p><p>听音选图：听一遍，再找对应画面。</p>`;
 byId('deskChips').innerHTML=GROUPS.map((g,gi)=>`<button class="dchip${gi===c.g?' active':''}" data-g="${gi}" aria-pressed="${gi===c.g}">${esc(g.name)}</button>`).join('');byId('deskFilm').innerHTML=deck.map((d,i)=>d.c.g===c.g?`<button class="mini${i===state.i?' active':''}" data-i="${i}" aria-current="${i===state.i?'true':'false'}">${esc(d.c.w)}</button>`:'').join('');byId('deskCounter').textContent=`${pos} / ${total}`;byId('deskFilm').querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'});
 }else byId('cardWrap').innerHTML=cardSVG(c);
 byId('sheetGrid').querySelectorAll('.chip').forEach(el=>el.classList.toggle('active',Number(el.dataset.g)===c.g));queueSave();if(mode==='deck')playWord(c)
}
function selectIndex(i){if(!deck.length)return;state.i=(i+deck.length)%deck.length;navigated=true;render()}
function go(delta){selectIndex(state.i+delta)}
function jumpTo(gi){const i=deck.findIndex(d=>d.c.g===gi);if(i>=0)selectIndex(i)}
function openSheet(){byId('sheetWrap').hidden=false;byId('closeSheet').focus()}
function closeSheet(){byId('sheetWrap').hidden=true;byId('groupBtn').focus()}
function tap(el,fn){let start=null;el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];start={x:t.clientX,y:t.clientY}},{passive:true});el.addEventListener('touchend',e=>{if(!start)return;const t=e.changedTouches[0];const hit=Math.abs(t.clientX-start.x)<12&&Math.abs(t.clientY-start.y)<12;start=null;if(hit){e.preventDefault();fn(e)}},{passive:false});el.addEventListener('click',fn)}
for(const id of ['playWord','deskPlayW'])tap(byId(id),()=>playWord());for(const id of ['playSpell','deskPlayS'])tap(byId(id),()=>playSpell());for(const id of ['mobilePrev','deskPrev'])tap(byId(id),()=>go(-1));for(const id of ['mobileNext','deskNext'])tap(byId(id),()=>go(1));
tap(byId('groupBtn'),openSheet);tap(byId('closeSheet'),closeSheet);tap(byId('sheetBackdrop'),closeSheet);tap(byId('toggleTips'),()=>{state.tipsOpen=!state.tipsOpen;byId('tips').hidden=!state.tipsOpen;byId('toggleTips').setAttribute('aria-pressed',String(state.tipsOpen))});
function delegateTap(container,selector,action){tap(container,e=>{const target=e.target.closest(selector);if(target)action(target)})}
delegateTap(byId('sheetGrid'),'.chip',b=>{jumpTo(Number(b.dataset.g));closeSheet()});delegateTap(byId('deskChips'),'.dchip',b=>jumpTo(Number(b.dataset.g)));delegateTap(byId('deskFilm'),'.mini',b=>selectIndex(Number(b.dataset.i)));tap(byId('cardWrap'),()=>playWord());tap(byId('deskArtSvg'),()=>playWord());
let swipe=null;byId('stage').addEventListener('touchstart',e=>{const t=e.touches[0];swipe={x:t.clientX,y:t.clientY}},{passive:true});byId('stage').addEventListener('touchend',e=>{if(!swipe)return;const t=e.changedTouches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y;swipe=null;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();go(dx<0?1:-1)}},{passive:false});byId('stage').addEventListener('touchcancel',()=>{swipe=null});
const quiz={target:null,answered:false,correct:0,total:0};
function celebrate(){const layer=document.createElement('div');layer.className='confetti';const colors=['#e8663c','#f2b53c','#4fae9f','#5fa8d8','#9b7fc4'];for(let i=0;i<30;i++){const p=document.createElement('i');p.style.left=(10+Math.random()*80)+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--dx',(Math.random()-.5)*220+'px');p.style.animationDelay=(Math.random()*.25)+'s';layer.append(p)}document.body.append(layer);setTimeout(()=>layer.remove(),2100)}
function nextQuestion(first=false){stopAudio();quiz.target=first?deck[state.i].c:deck[Math.floor(Math.random()*deck.length)].c;quiz.answered=false;byId('quizNext').disabled=true;byId('quizFeedback').textContent='听单词，选对应的图片。';const pool=CARDS.filter(c=>c.key!==quiz.target.key&&ART[c.key]);const options=[quiz.target];while(options.length<4&&pool.length){const at=Math.floor(Math.random()*pool.length);options.push(pool.splice(at,1)[0])}options.sort(()=>Math.random()-.5);byId('quizChoices').innerHTML=options.map((c,i)=>`<button class="quiz-choice" data-key="${esc(c.key)}" aria-label="图片 ${i+1}"><svg viewBox="0 0 760 480" aria-hidden="true">${ART[c.key]}</svg></button>`).join('');clip(wordUrl(quiz.target),audioGeneration)}
function startQuiz(){stopAudio();byId('quizDialog').showModal();nextQuestion(true)}
for(const id of ['playQuiz','deskQuiz'])tap(byId(id),startQuiz);tap(byId('quizReplay'),()=>{stopAudio();clip(wordUrl(quiz.target),audioGeneration)});tap(byId('quizNext'),()=>nextQuestion());tap(byId('quizClose'),()=>byId('quizDialog').close());byId('quizDialog').addEventListener('close',stopAudio);
delegateTap(byId('quizChoices'),'.quiz-choice',b=>{if(quiz.answered)return;if(b.dataset.key!==quiz.target.key){b.classList.add('wrong');byId('quizFeedback').textContent='再听一次，换一张试试。';stopAudio();clip(wordUrl(quiz.target),audioGeneration);return}quiz.answered=true;quiz.total++;quiz.correct++;b.classList.add('correct');byId('quizScore').textContent=`答对 ${quiz.correct} 题`;byId('quizFeedback').textContent=`答对了！${quiz.target.w} · ${quiz.target.cn}`;byId('quizNext').disabled=false;celebrate()});
document.addEventListener('keydown',e=>{if(byId('quizDialog').open)return;if(e.key==='Escape'){closeSheet();return}if(e.target.closest('button,a,input,select,textarea'))return;if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key==='ArrowRight'){e.preventDefault();go(1)}if(e.key===' '){e.preventDefault();playWord()}if(e.key==='Enter'){e.preventDefault();playSpell()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();clearTimeout(saveTimer)}else queueSave()});deskMQ.addEventListener('change',()=>{updateDeskMode();render()});
byId('sheetGrid').innerHTML=GROUPS.map((g,gi)=>`<button class="chip" data-g="${gi}">${esc(g.name)}</button>`).join('');
if(mode==='deck'&&qs.get('from')==='hub'){try{const saved=JSON.parse(localStorage.getItem('hz.deck.'+DECK_META.id)||'null');const i=saved?.key?deck.findIndex(d=>d.c.key===saved.key):saved?.i;if(i>=0&&i<deck.length)state.i=i}catch(e){}}
const initial=Number(qs.get(mode==='static'?'n':'i'));if(initial>=1&&initial<=deck.length)state.i=initial-1;
updateDeskMode();
if(mode==='grid'){document.body.classList.add('grid');byId('stage').innerHTML=deck.map(d=>cardSVG(d.c)).join('')}else{if(mode==='static')document.body.classList.add('static');render()}
</script>
</body>
</html>
