<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>识字卡片 · 电脑版布局示意 v3（米字格·三栏等高）</title>
<style>
  :root {
    --page:#fdf8ec; --ink:#4a3226; --muted:#8d7d73; --accent:#3e9486;
    --button:#dff4f1; --button-hover:#c5ebe7; --band:#fbf0c2; --sent:#d9f0ea;
    --card-line:#f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; border-bottom: 2px solid #f3e7cd; background: #fbf3dd;
  }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  .chips { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding: 2px; }
  .chip {
    border: 0; border-radius: 999px; background: var(--button); color: #2f6b60;
    padding: 6px 14px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: var(--accent); color: #fff; font-weight: 600; }
  .switch { white-space: nowrap; font-size: 13px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: minmax(430px, 35vw) 1fr minmax(300px, 24vw); gap: 16px; padding: 14px 18px; min-height: 0; }
  .zone { min-height: 0; }
  .card-box {
    height: 100%; display: flex; flex-direction: column;
    background: #fff9ea; border: 2px solid #f3e7cd; border-radius: 22px; padding: 14px;
  }
  .art-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .art-area svg { width: 100%; height: 100%; }
  .sent-pill {
    flex: 0 0 auto; margin: 10px 8px 4px; background: #d9f0ea; border-radius: 18px;
    padding: 10px 12px; text-align: center; font-size: 19px; font-weight: 600;
  }
  .center .card-box { align-items: center; justify-content: center; }
  .board { position: relative; width: min(100%, 64vh); aspect-ratio: 1; cursor: pointer; }
  .board svg { width: 100%; height: 100%; display: block; }
  .replay {
    position: absolute; right: 10px; bottom: 10px; border: 0; border-radius: 999px;
    background: var(--button); color: #2f6b60; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .replay:hover { background: var(--button-hover); }
  .panel { background: none; border: 0; border-radius: 0; padding: 6px 8px; overflow-y: auto; }
  .panel .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .panel .head .zi { font-size: 44px; font-weight: 700; line-height: 1; }
  .panel .head .meta { color: var(--muted); font-size: 14px; }
  .panel .lead { font-size: 13px; color: var(--muted); margin: 0 0 12px; border-bottom: 1px dashed #e8d9b8; padding-bottom: 10px; }
  .tip-row { display: flex; gap: 10px; margin: 10px 0; font-size: 15px; line-height: 1.55; }
  .tip-tag { flex: 0 0 auto; background: var(--band); border-radius: 8px; padding: 2px 8px; font-size: 13px; height: fit-content; }
  footer { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 20px 14px; border-top: 2px solid #f3e7cd; background: #fbf3dd; }
  .nav-btn {
    border: 0; border-radius: 999px; background: var(--accent); color: #fff;
    width: 44px; height: 44px; font-size: 20px; cursor: pointer; flex: 0 0 auto;
  }
  .nav-btn:hover { filter: brightness(1.08); }
  .film { flex: 1; display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; }
  .mini {
    flex: 0 0 auto; width: 46px; height: 52px; border: 2px solid transparent; border-radius: 12px;
    background: var(--button); color: var(--ink); font-family: "Songti SC", "STSong", serif;
    font-size: 26px; cursor: pointer; position: relative;
  }
  .mini:hover { background: var(--button-hover); }
  .mini.active { border-color: var(--accent); background: #fff; font-weight: 700; }
  .counter { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 76px; font-size: 12px; color: #b0a49a; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>识字卡片 · 422 字</h1>
  <nav class="chips" id="chips"></nav>
  <span class="switch">书写：自动循环</span>
</header>

<main>
  <section class="zone">
    <div class="card-box">
      <div class="art-area">
        <svg id="artSvg" viewBox="0 0 744 510" preserveAspectRatio="xMidYMid meet" aria-label="插画"></svg>
      </div>
      <div class="sent-pill" id="sentPill"></div>
    </div>
  </section>

  <section class="zone center">
    <div class="card-box">
    <div class="board" id="board" title="点一下重写">
      <svg viewBox="0 0 600 600" aria-label="米字格笔顺">
        <rect x="6" y="6" width="588" height="588" rx="36" fill="#fffdf3" stroke="#e3d3a8" stroke-width="4"/>
        <rect x="44" y="44" width="512" height="512" fill="#fffef9" stroke="#cbb37f" stroke-width="5"/>
        <g stroke="#dcc690" stroke-width="2.5" stroke-dasharray="12 10" fill="none">
          <line x1="44" y1="300" x2="556" y2="300"/>
          <line x1="300" y1="44" x2="300" y2="556"/>
          <line x1="44" y1="44" x2="556" y2="556"/>
          <line x1="44" y1="556" x2="556" y2="44"/>
        </g>
        <g id="ink"></g>
      </svg>
      <button class="replay" id="replay">↻ 重写</button>
    </div>
    </div>
  </section>

  <section class="zone">
    <div class="card-box"><div class="panel" id="panel"></div></div>
  </section>
</main>

<footer>
  <button class="nav-btn" id="prev" aria-label="上一张">←</button>
  <div class="film" id="film"></div>
  <span class="counter" id="counter"></span>
  <button class="nav-btn" id="next" aria-label="下一张">→</button>
</footer>
<div class="hint">← → 键或底部胶片条切换 · 示意原型 v3（三栏等高，米字格）</div>

const GROUPS = groups.map((g, i) => ({ id: g.id, name: g.name, gi: i }));

const STROKE_TIME = { draw: 620, gap: 140, charGap: 420, hold: 1900 };
let idx = 2; /* 默认停在「山」 */
let gen = 0;

function decodeChar(flatStrokes) {
  return flatStrokes.map((flat) => {
    const pts = []; let x = flat[0] * 8, y = flat[1] * 8;
    pts.push([x, y]);
    for (let k = 2; k < flat.length; k += 2) { x += flat[k] * 8; y += flat[k + 1] * 8; pts.push([x, y]); }
    return pts;
  });
}

function renderArt(c) {
  document.getElementById("artSvg").innerHTML = art5[c.key];
  document.getElementById("sentPill").textContent = c.sentence;
}

function renderBoard(c) {
  const layer = document.getElementById("ink");
  const myGen = ++gen;
  layer.innerHTML = "";
  const strokes = decodeChar(strokes5[c.char]);
  const s = 0.5, w = 1024 * s;
  const holder = document.createElementNS("http://www.w3.org/2000/svg", "g");
  holder.setAttribute("transform", `translate(${(600 - w) / 2} ${(600 - w) / 2 + w}) scale(${s} ${-s})`);
  layer.appendChild(holder);
  function makePath(pts) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M " + pts.map((q) => q[0] + " " + q[1]).join(" L "));
    p.setAttribute("fill", "none"); p.setAttribute("stroke", "#4a3226");
    p.setAttribute("stroke-width", "83"); p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round"); p.setAttribute("pathLength", "1");
    p.style.strokeDasharray = "1 1.06"; p.style.strokeDashoffset = "1";
    return p;
  }
  function play() { if (myGen !== gen) return; holder.innerHTML = ""; setTimeout(() => step(0), 350); }
  function step(si) {
    if (myGen !== gen) return;
    if (si >= strokes.length) { setTimeout(() => { if (myGen === gen) play(); }, STROKE_TIME.hold); return; }
    const p = makePath(strokes[si]);
    holder.appendChild(p);
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${STROKE_TIME.draw}ms ease-in-out`;
    p.style.strokeDashoffset = "0";
    setTimeout(() => step(si + 1), STROKE_TIME.draw + STROKE_TIME.gap);
  }
  play();
}

function renderPanel(c, pos, total, gname) {
  document.getElementById("panel").innerHTML = `
    <div class="head"><span class="zi">${c.char}</span><span class="meta">${gname} · 第 ${pos} / ${total} 卡</span></div>
    <p class="lead">先指大字读一遍，再顺着画面说句子，等孩子回应。</p>
    <div class="tip-row"><span class="tip-tag">读音</span><span><b>${c.pinyin}</b>（${c.tone}）</span></div>
    <div class="tip-row"><span class="tip-tag">怎么说</span><span>${c.say}</span></div>
    <div class="tip-row"><span class="tip-tag">怎么聊</span><span>${c.chat}</span></div>
    <div class="tip-row"><span class="tip-tag">生活里</span><span>${c.life}</span></div>`;
}

function renderChips() {
  const cur = cards5[idx].g;
  document.getElementById("chips").innerHTML = GROUPS.map((g) =>
    `<button class="chip${g.gi === cur ? " active" : ""}">${g.name}</button>`).join("");
}

function renderFilm() {
  document.getElementById("film").innerHTML = cards5.map((c, i) =>
    `<button class="mini${i === idx ? " active" : ""}" data-i="${i}">${c.char}</button>`).join("");
}

function render() {
  const c = cards5[idx];
  const gname = (GROUPS.find(g => g.gi === c.g) || {}).name || "";
  document.getElementById("counter").textContent = `${idx + 1} / ${cards5.length} · ${gname}`;
  renderArt(c); renderBoard(c); renderPanel(c, idx + 1, cards5.length, gname);
  renderChips(); renderFilm();
}

document.getElementById("prev").onclick = () => { idx = (idx - 1 + cards5.length) % cards5.length; render(); };
document.getElementById("next").onclick = () => { idx = (idx + 1) % cards5.length; render(); };
document.getElementById("film").addEventListener("click", (e) => {
  const b = e.target.closest(".mini"); if (b) { idx = +b.dataset.i; render(); }
});
document.getElementById("board").onclick = () => renderBoard(cards5[idx]);
document.getElementById("replay").onclick = (e) => { e.stopPropagation(); renderBoard(cards5[idx]); };
