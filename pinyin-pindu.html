<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234a90c9'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fdf8ec' font-family='serif'%3E拼%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#fdf8ec">
  <title>拼音拼读卡</title>
  <style>
    :root {
      color-scheme: light;
      --page: #fdf8ec; --ink: #4a3226; --muted: #8d7d73;
      --accent: #4a90c9; --button: #dff4f1; --button-hover: #c5ebe7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--page); }
    body { color: var(--ink); font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

    .gallery { width: 100%; height: 100dvh; height: 100svh; display: flex; flex-direction: column;
               padding: max(6px, env(safe-area-inset-top)) 8px 10px; }
    .head { flex: 0 0 auto; text-align: center; padding: 2px 0 4px; }
    .head .t { font-size: 16px; font-weight: 700; color: var(--accent); }
    .head .s { font-size: 12px; color: var(--muted); margin-left: 8px; }
    .stage { min-height: 0; flex: 1; display: grid; place-items: center; }

    /* 手机卡面：一张 SVG 卡（viewBox 800×1000） */
    .card-svg { display: block; width: min(96vw, calc((100svh - 150px) * 0.8)); aspect-ratio: 800 / 1000;
                height: auto; filter: drop-shadow(0 10px 24px rgba(112, 83, 49, 0.16));
                user-select: none; -webkit-user-drag: none; }

    .bar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px;
           padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); touch-action: pan-y; }
    button { border: 0; border-radius: 999px; background: var(--button); color: var(--ink);
             font: inherit; cursor: pointer; touch-action: manipulation; white-space: nowrap;
             transition: background 160ms ease, transform 140ms ease; }
    button:hover { background: var(--button-hover); }
    button:active { transform: scale(0.94); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .pill { flex: 0 0 auto; padding: 9px 13px; font-size: 14px; background: #fbeecb; }
    .pill[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .primary { flex: 0 0 auto; padding: 10px 22px; font-size: 15px; font-weight: 600; background: var(--accent); color: #fff; }
    .group-btn { flex: 0 0 auto; display: flex; align-items: baseline; justify-content: center; gap: 6px;
                 padding: 9px 12px; font-size: 14px; background: #fff; border: 1.5px solid #ead9ac; }
    .group-btn.flash { background: #fdeaa0; border-color: var(--accent); }
    .group-btn .caret { color: var(--muted); font-size: 11px; }
    .counter { color: var(--muted); font-size: 13px; }

    .sheet-wrap { position: fixed; inset: 0; z-index: 30; }
    .sheet-wrap[hidden] { display: none; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(74, 50, 38, 0.35); }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62dvh; overflow: auto;
             background: var(--page); border-radius: 22px 22px 0 0; padding: 14px;
             padding-bottom: calc(16px + env(safe-area-inset-bottom));
             box-shadow: 0 -8px 30px rgba(112, 83, 49, 0.25); }
    .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .sheet-grid .chip { border: 1.5px solid #ead9ac; background: #fff; color: var(--ink);
                        border-radius: 14px; padding: 10px 6px; font-size: 14.5px; text-align: center;
                        font-family: inherit; cursor: pointer; touch-action: manipulation; }
    .sheet-grid .chip.active { background: var(--accent); border-color: var(--accent); font-weight: 600; color: #fff; }

    .tips { flex: 0 0 auto; max-height: 30dvh; overflow: auto; margin: 0 4px 6px; padding: 12px 16px;
            background: #ffffff; border: 1.5px solid #f0dfb6; border-radius: 18px; font-size: 15px; line-height: 1.75; }
    .tips .lead { color: var(--muted); font-size: 13.5px; margin-bottom: 6px; }
    .tip-row { display: flex; gap: 8px; align-items: baseline; }
    .tip-tag { flex: 0 0 auto; color: #a07b33; font-size: 12.5px; background: #fbf0c2; border-radius: 8px; padding: 1px 8px; }

    body.grid { overflow: auto; }
    body.grid .gallery { height: auto; min-height: 100dvh; display: block; padding: 24px; }
    body.grid .head { margin-bottom: 14px; }
    body.grid .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 320px)); gap: 22px; justify-content: center; padding: 0; }
    body.grid .card-svg { width: 100%; max-width: 320px; filter: none; }
    body.grid .bar, body.grid .tips { display: none; }

    /* ════════ 宽屏三栏（≥960px，JS matchMedia 切 body.desk-on） ════════ */
    #desk { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #desk[hidden] { display: none; }
    body.desk-on .head, body.desk-on .stage, body.desk-on .bar, body.desk-on .tips { display: none; }
    body.desk-on .gallery { padding: 0; }
    .desk-top { flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
                padding: 10px 20px; border-bottom: 2px solid #f3e7cd; background: #fbf3dd; }
    .desk-top h1 { font-size: 18px; margin: 0; white-space: nowrap; }
    .desk-top h1 .s { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
    .desk-chips { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding: 2px; }
    .dchip { border: 0; border-radius: 999px; background: var(--button); color: #2f6b60;
             padding: 6px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .dchip:hover { background: var(--button-hover); }
    .dchip.active { background: var(--accent); color: #fff; font-weight: 600; }
    .desk-modes { display: flex; gap: 6px; }
    .desk-modes .pill { padding: 6px 12px; font-size: 13px; }
    .desk-main { flex: 1; min-height: 0; display: grid; gap: 16px; padding: 14px 18px;
                 grid-template-columns: minmax(320px, 30vw) minmax(300px, 1fr) minmax(280px, 24vw); }
    @media (min-width: 1440px) { .desk-main { grid-template-columns: minmax(400px, 34vw) 1fr minmax(300px, 24vw); } }
    .desk-main .zone { min-height: 0; }
    .card-box { height: 100%; display: flex; flex-direction: column; background: #fff9ea;
                border: 2px solid #f3e7cd; border-radius: 22px; padding: 14px; overflow: hidden; }
    .art-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .art-area svg { width: 100%; height: 100%; }
    .desk-pill { flex: 0 0 auto; margin: 10px 8px 4px; background: #d9f0ea; border-radius: 16px;
                 padding: 9px 12px; text-align: center; font-size: 17px; font-weight: 600; line-height: 1.5; }
    .desk-pill.q { background: #fbf0c2; font-weight: 500; color: #6b5a4e; font-size: 15px; }
    .desk-center { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column;
                   align-items: center; justify-content: center; gap: 10px; }
    .board-wrap { position: relative; width: min(100%, 58vh); aspect-ratio: 100/140; max-height: 100%; }
    .board-wrap svg { width: 100%; height: 100%; display: block; }
    .desk-hint { font-size: 13px; color: var(--muted); }
    .desk-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .desk-actions .pill { font-size: 13px; padding: 7px 13px; }
    .quiz-row { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
    .quiz-chip { width: 64px; height: 76px; border-radius: 14px; border: 2px solid #ead9ac; background: #fff; }
    .quiz-chip svg { width: 100%; height: 100%; }
    .quiz-chip.right { border-color: var(--accent); background: #e8f7f3; }
    .quiz-chip.wrong { opacity: 0.35; }
    .tone-grid { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: 10px;
                  align-items: center; justify-content: center; }
    .tone-road { width: min(100%, 46vh); }
    .word-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; padding: 0 4px; }
    .word-tile { background: #fbf3e2; border-radius: 14px; padding: 8px 4px; text-align: center; cursor: pointer; }
    .word-tile .wsy { font-size: 21px; font-weight: 700; color: var(--accent); }
    .word-tile .wzi { font-size: 15px; color: var(--ink); }
    .word-tile .wart { height: 56px; }
    .word-tile .wart svg { width: 100%; height: 100%; }
    .word-tile.on { outline: 3px solid var(--accent); background: #fff; }
    .trow .hl { opacity: 0; transition: opacity .3s ease; }
    .trow.on .hl { opacity: 1; }
    .word-tile .wsay { font-size: 11px; color: var(--muted); }
    .match-flip { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .match-face { width: min(100%, 46vh); aspect-ratio: 760/480; }
    .match-face svg, .match-face .mback { width: 100%; height: 100%; }
    .mback { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
             background: #fbf3e2; border-radius: 30px; }
    .spell-stage { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .spell-out { width: min(100%, 44vh); }
    .spell-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .spell-chip { width: 56px; height: 68px; border-radius: 12px; border: 2px solid #ead9ac; background: #fff; padding: 2px; }
    .spell-chip svg { width: 100%; height: 100%; }
    .spell-reveal { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; padding: 8px 14px; }
    .spell-reveal .rart { width: 150px; height: 95px; }
    .spell-reveal .rart svg { width: 100%; height: 100%; }
    .spell-reveal .rzi { font-size: 34px; font-weight: 800; }
    .desk-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px; }
    .desk-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .desk-head .zi { font-size: 42px; font-weight: 700; line-height: 1; font-family: 'Songti SC','STSong','SimSun',serif; }
    .desk-head .meta { color: var(--muted); font-size: 14px; }
    .desk-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
                 padding: 10px 20px 14px; border-top: 2px solid #f3e7cd; background: #fbf3dd; }
    .nav-btn { border: 0; border-radius: 999px; background: var(--accent); color: #fff;
               width: 44px; height: 44px; font-size: 20px; cursor: pointer; flex: 0 0 auto; }
    .nav-btn:hover { filter: brightness(1.08); }
    .film { flex: 1; display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; }
    .mini { flex: 0 0 auto; min-width: 46px; height: 52px; width: 52px; border: 2px solid transparent; border-radius: 12px;
            background: var(--button); color: var(--ink); padding: 2px; }
    .mini svg { width: 100%; height: 100%; }
    .mini:hover { background: var(--button-hover); }
    .mini.active { border-color: var(--accent); background: #fff; }
    .mini.wide { width: auto; padding: 0 12px; font-size: 15px; font-weight: 600; }
    #desk .counter { font-size: 14px; white-space: nowrap; }
    .hidden { display: none !important; }
    @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .pop { animation: pop .45s ease; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
    .quiz-chip.wrong, .quiz.wrong { animation: shake .45s ease; }
    .quiz-chip.wrong { border-color: #c05a4a !important; background: #fdecea !important; }
    .card-box.win { background: #e9f8ef; border-color: #7cc8a8; }
    .cf { position: fixed; top: -18px; width: 12px; height: 18px; border-radius: 3px; z-index: 9998;
          pointer-events: none; animation: cfall 2.3s ease-in forwards; }
    @keyframes cfall { to { transform: translateY(108vh) rotate(560deg); } }
    @keyframes bump { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
    .bump { animation: bump .5s ease; }
  
    /* 微信内引导条（仅 MicroMessenger UA 显示） */
    .wx-tip { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
              background: var(--button, #dff4f1); color: var(--ink, #4a3226); border-radius: 14px; padding: 10px 14px;
              font-size: 14px; display: none; align-items: center; gap: 10px;
              box-shadow: 0 4px 16px rgba(74,50,38,.18); z-index: 999; }
    .wx-tip.show { display: flex; }
    .wx-tip .wx-x { margin-left: auto; color: var(--muted, #8d7d73); padding: 2px 6px; cursor: pointer; }
</style>
</head>
<body>
  <main class="gallery" aria-label="拼音拼读卡">
    <header class="head" id="head"></header>
    <section class="stage" id="stage"><div id="cardWrap"></div></section>
    <section id="tips" class="tips" hidden></section>
    <nav class="bar" id="bar">
      <button id="primaryBtn" class="primary"></button>
      <button id="groupBtn" class="group-btn" aria-label="左右滑切换分组，轻点打开分组列表">
        <span id="groupName">—</span><span id="counter" class="counter"></span><span class="caret">▾</span>
      </button>
      <button id="toggleTips" class="pill" aria-pressed="false">提示</button>
    </nav>
    <div id="sheetWrap" class="sheet-wrap" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet"><div class="sheet-grid" id="sheetGrid"></div></div>
    </div>
    <div id="desk" hidden>
      <header class="desk-top">
        <h1 id="deskTitle"></h1>
        <nav class="desk-chips" id="deskChips" hidden></nav>
        <div class="desk-modes" id="deskModes">
          <button class="pill" data-mode="ren" aria-pressed="true">一起读</button>
          <button class="pill" data-mode="zhao" aria-pressed="false">猜一猜</button>
        </div>
      </header>
      <section class="desk-main">
        <div class="zone"><div class="card-box" id="deskLeft"></div></div>
        <div class="zone"><div class="card-box"><div class="desk-center" id="deskCenter"></div></div></div>
        <div class="zone"><div class="card-box"><div class="desk-panel" id="deskPanel"></div></div></div>
      </section>
      <footer class="desk-foot">
        <button class="nav-btn" id="deskPrev" aria-label="上一张">←</button>
        <div class="film" id="deskFilm" aria-label="组内卡片"></div>
        <span class="counter" id="deskCounter"></span>
        <button class="nav-btn" id="deskNext" aria-label="下一张">→</button>
      </footer>
    </div>
  </main>

        <text x="400" y="140" text-anchor="middle" font-size="56" font-weight="800" fill="${ACCENT}">${esc(c.letter)}</text>
        <g transform="translate(${400 - 190} 260) scale(3.8)">${gridLines()}${glyphGroup(c.letter, { w: 13 })}</g>
        ${band(96, 620, 608, 200, 34, "#d9f0ea")}
        <text x="400" y="700" text-anchor="middle" font-size="52" font-weight="800" fill="${INK}">${esc(c.zi)}</text>
        <text x="400" y="772" text-anchor="middle" font-size="36" fill="${ACCENT}">${esc(c.py)}</text>
        <text x="400" y="900" text-anchor="middle" font-size="27" fill="${MUTED}">点卡片，翻回去</text></svg>`;
    }

    function spellCardShell(c) {
      const pick = c._pick;
      const chosen = pick != null ? c.chips[pick] : null;
      let result = band(76, 788, 648, 176, 30, "#d9f0ea") +
        `<text x="400" y="856" text-anchor="middle" font-size="29" fill="${MUTED}">点一个声母，让它和 ${esc(c.final)} 碰一碰</text>` +
        `<text x="400" y="918" text-anchor="middle" font-size="31" fill="${INK}">前音轻短后音重，两音相连猛一碰</text>`;
      if (chosen) {
        result = band(76, 788, 648, 176, 30, "#d9f0ea") +
          `<g transform="translate(120 800) scale(0.94)">${syllableInner(chosen.sy)}</g>` +
          `<text x="356" y="908" text-anchor="middle" font-size="50" font-weight="800" fill="${INK}">${esc(chosen.zi)}</text>` +
          `<text x="510" y="892" text-anchor="middle" font-size="30" fill="${ACCENT}">${esc(chosen.ini)} + ${esc(c.final)} → ${esc(chosen.sy)}</text>`;
      }
      return `<svg viewBox="0 0 800 1000" role="img" aria-label="${esc(c.final)}" class="card-svg">${frame()}
        <rect x="58" y="46" width="684" height="120" rx="34" fill="#fbf0c2"/>
        <text x="400" y="122" text-anchor="middle" font-size="44" font-weight="800" fill="${ACCENT}">拼读游乐场 · 韵母 ${esc(c.final)}</text>
        <g transform="translate(290 170) scale(2.2)">${gridLines()}${glyphGroup(c.final === "ü" ? "ü" : c.final, { w: 13 })}</g>
        ${c.chips.map((ch, i) => {
          const col = i % 4, row = Math.floor(i / 4);
          const x = 106 + col * 152, y = 470 + row * 158;
          return `<g class="schip" data-i="${i}">
          <rect x="${x}" y="${y}" width="126" height="140" rx="20" fill="#fff" stroke="#ead9ac" stroke-width="4"/>
          <g transform="translate(${x} ${y + 4}) scale(1.22)">${glyphGroup(ch.ini === "ü" ? "ü" : ch.ini, { w: 13 })}</g></g>`;
        }).join("")}
        ${result}</svg>`;
    }
    function syllableInner(py) {
      const seq = syllableLetters(py);
      const box = 66, gap = 6, W = seq.length * (box + gap), H = 106;
      let inner = "";
      seq.forEach((o, i) => {
        const x = i * (box + gap);
        inner += [10, 50, 90, 130].map((y, k) =>
          `<line x1="${x + 3}" y1="${y / 140 * H}" x2="${x + box - 3}" y2="${y / 140 * H}" stroke="#cbb37f" stroke-width="${k === 0 || k === 3 ? 1.5 : 0.9}" stroke-dasharray="${k === 1 || k === 2 ? "4 4" : ""}"/>`).join("");
        const sc = box / 100, sh = H / 140;
        inner += `<g transform="translate(${x} 0) scale(${sc} ${sh})">${glyphGroup(o.L, { w: 15 })}</g>`;
        if (o.tone && TONE_MARKS[o.tone]) inner += `<path d="${TONE_MARKS[o.tone].d}" transform="translate(${x + box / 2} 0) scale(${sc} ${sh})" fill="none" stroke="#c05a4a" stroke-width="10" stroke-linecap="round"/>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}">${inner}</svg>`;
    }

    function artOf(c) {
      return c.art || "";
    }

    /* ---------- 渲染 ---------- */
    const cardWrap = document.getElementById("cardWrap");
    const counter = document.getElementById("counter");
    const groupName = document.getElementById("groupName");
    const tips = document.getElementById("tips");
    const primaryBtn = document.getElementById("primaryBtn");
    const toggleTips = document.getElementById("toggleTips");
    const hasPrimary = true;

    function render() {
      if (mode === "deck" && deskActive) return renderDesk();
      const { c } = deck[state.i];
      if (c.type === "spell") { cardWrap.innerHTML = cardSVG(c); }
      else cardWrap.innerHTML = cardSVG(c);
      bindCard(cardWrap, c);
      groupName.textContent = GROUPS[c.g].name;
      const inGroup = CARDS.filter((x) => x.g === c.g).length;
      const pos = CARDS.filter((x, idx) => x.g === c.g && idx <= deck[state.i].i).length;
      counter.textContent = `${pos} / ${inGroup}`;
      primaryBtn.style.display = (hasPrimary && (c.type === "letter" || c.type === "match")) ? "" : "none";
      if (hasPrimary && (c.type === "letter" || c.type === "match")) {
        let label;
        if (c.type === "match") label = state.revealed ? "翻回图" : "看字母";
        else if (c.type === "letter") label = state.mode === "ren" ? "猜一猜" : (state.revealed ? "一起读" : "看答案");
        else label = state.revealed ? "收起来" : "变！";
        primaryBtn.textContent = label;
        primaryBtn.setAttribute("aria-pressed", String(state.revealed));
      }
      document.querySelectorAll(".chip").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.g) === c.g);
      });
      if (c.type === "letter" && !(state.mode === "zhao" && !state.revealed)) speakLetter(c.letter);
      if (c.type === "match" && state.revealed) speakLetter(c.letter);
    }

    function animateLetterGlyphs(root, letters) {
      const gen = ++animGen;
      const paths = [...root.querySelectorAll(".midx path[data-live]")];
      if (!paths.length) return;
      let idx = 0;
      function step() {
        if (gen !== animGen) return;
        if (idx >= paths.length) {
          setTimeout(() => {
            if (gen !== animGen) return;
            paths.forEach((q) => { q.style.transition = "none"; q.style.strokeDashoffset = "1"; });
            idx = 0;
            setTimeout(step, 400);
          }, 1600);
          return;
        }
        const q = paths[idx];
        q.getBoundingClientRect();
        q.style.transition = "stroke-dashoffset 700ms ease-in-out";
        q.style.strokeDashoffset = "0";
        idx++;
        setTimeout(step, 900);
      }
      setTimeout(step, 450);
    }
    function bindCard(root, c) {
      if (c.type === "letter" && (state.mode === "ren" || state.revealed)) {
        animateLetterGlyphs(root, c.combo || [c.letter]);
      }
      root.querySelectorAll(".quiz").forEach((el) => {
        el.addEventListener("click", () => {
          const ok = el.dataset.l === c.letter;
          if (ok) {
            el.querySelector("rect").setAttribute("stroke", "#3e9486");
            el.setAttribute("class", "quiz right");
            state.revealed = true;
            celebrate();
            setTimeout(render, 900);
          } else {
            const g = el;
            g.classList.remove("wrong"); void g.getBBox;
            g.classList.add("wrong");
            g.querySelector("rect").setAttribute("stroke", "#c05a4a");
          }
        });
      });
      root.querySelectorAll(".wtile").forEach((el) => {
        el.addEventListener("click", () => {
          root.querySelectorAll(".wtile").forEach((x) => x.classList.remove("on"));
          el.classList.add("on");
          const w = c.words[Number(el.dataset.i)];
          if (w) speak(w.sy + "," + w.zi);
        });
      });
      root.querySelectorAll(".schip").forEach((el) => {
        el.addEventListener("click", () => {
          c._pick = Number(el.dataset.i);
          const ch = c.chips[c._pick];
          celebrate();
          speak(`${LETTER_SOUND[ch.ini] || ch.ini}、${LETTER_SOUND[c.final] || c.final}，${ch.sy}，${ch.zi}`);
          render();
        });
      });
      const flip = root.querySelector(".card-svg");
      if (c.type === "match" && flip) {
        flip.addEventListener("click", () => { state.revealed = !state.revealed; render(); });
      }
    }

    function go(delta) {
      state.i = (state.i + delta + deck.length) % deck.length;
      state.revealed = false;
      if (deck[state.i].c.type === "spell") deck[state.i].c._pick = null;
      closeTips();
      render();
    }
    function jumpTo(gi) {
      const at = deck.findIndex((d) => d.c.g === gi);
      if (at >= 0) { state.i = at; state.revealed = false; closeTips(); render(); }
    }
    function closeTips() { tips.hidden = true; toggleTips.setAttribute("aria-pressed", "false"); }
    function tipsHTML(c) {
      let h = `<div class="lead">${KIND === "letter" ? "两种玩法：一起读（跟着笔顺写、跟着念）→ 猜一猜（你说是哪个字母，点开验证）。" : "配对卡：看图猜字母，翻开验证；拼读游乐场：点声母和韵母碰一碰。"}</div>`;
      if (c.type === "letter") h += `<div class="tip-row"><span class="tip-tag">口诀</span><span>${esc(c.jue)}</span></div>
        <div class="tip-row"><span class="tip-tag">发音</span><span>${esc(c.tip)}</span></div>
        <div class="tip-row"><span class="tip-tag">笔顺</span><span>${esc(strokeNames(c))}</span></div>`;
      if (c.type === "tone") h += `<div class="tip-row"><span class="tip-tag">玩法</span><span>每个词点一下跟着读；问孩子「哪个声音是往上飞的？」</span></div>`;
      if (c.type === "match") h += `<div class="tip-row"><span class="tip-tag">词</span><span>${esc(c.zi)}（${esc(c.py)}）</span></div>`;
      return h;
    }
    function strokeNames(c) {
      const letters = c.combo || [c.letter];
      return letters.map((L) => (STROKES[L] || []).map((s, i) => `第${i + 1}笔${s.n}`).join("，")).join("｜");
    }

    function openSheet() {
      sheetWrap.hidden = false;
      const act = document.querySelector(".chip.active");
      if (act) act.scrollIntoView({ block: "center" });
    }
    function closeSheet() { sheetWrap.hidden = true; }

    function bindTap(el, fn) {
      let sx = 0, sy = 0;
      el.addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
      el.addEventListener("touchend", (e) => {
        const t = e.changedTouches[0];
        if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) return;
        e.preventDefault(); fn(e);
      }, { passive: false });
      el.addEventListener("click", fn);
    }

    if (hasPrimary) bindTap(primaryBtn, () => {
      const c = deck[state.i].c;
      if (KIND === "letter" && c.type === "letter") {
        if (state.mode === "ren") { state.mode = "zhao"; state.revealed = false; }
        else if (!state.revealed) { state.revealed = true; }
        else { state.mode = "ren"; state.revealed = false; }
        render();
      } else { state.revealed = !state.revealed; render(); }
    });
    bindTap(toggleTips, () => {
      const open = tips.hidden;
      if (open) { tips.innerHTML = tipsHTML(deck[state.i].c); tips.hidden = false; }
      else closeTips();
      toggleTips.setAttribute("aria-pressed", String(open));
    });
    const sheetWrap = document.getElementById("sheetWrap");
    const sheetGrid = document.getElementById("sheetGrid");
    bindTap(document.getElementById("sheetBackdrop"), closeSheet);
    sheetGrid.addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (b) { jumpTo(Number(b.dataset.g)); closeSheet(); }
    });
    sheetGrid.addEventListener("touchend", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      e.preventDefault(); jumpTo(Number(b.dataset.g)); closeSheet();
    }, { passive: false });

    function cycleGroup(dir) {
      const next = (deck[state.i].c.g + dir + GROUPS.length) % GROUPS.length;
      jumpTo(next);
      groupBtn.classList.add("flash");
      setTimeout(() => groupBtn.classList.remove("flash"), 240);
    }
    const groupBtn = document.getElementById("groupBtn");
    let barTouch = null;
    const bar = document.getElementById("bar");
    bar.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      barTouch = { x: t.clientX, y: t.clientY, onGroup: !!(e.target.closest && e.target.closest("#groupBtn")) };
    }, { passive: true });
    bar.addEventListener("touchend", (e) => {
      if (!barTouch) { return; }
      const t = e.changedTouches[0];
      const dx = t.clientX - barTouch.x, dy = t.clientY - barTouch.y;
      const onGroup = barTouch.onGroup; barTouch = null;
      const horiz = Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy) * 1.4;
      const isTap = Math.abs(dx) <= 12 && Math.abs(dy) <= 12;
      if (onGroup) {
        if (horiz) { e.stopPropagation(); e.preventDefault(); cycleGroup(dx < 0 ? 1 : -1); }
        else if (isTap) { e.preventDefault(); openSheet(); }
        return;
      }
      if (horiz) { e.stopPropagation(); e.preventDefault(); go(dx < 0 ? 1 : -1); }
    }, { passive: false });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
      if (e.key === "Escape") closeSheet();
    });
    let touchX = null, touchY = null;
    document.addEventListener("touchstart", (e) => {
      if (e.target.closest && e.target.closest(".bar")) { touchX = null; return; }
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (touchX === null || (e.target.closest && e.target.closest(".bar"))) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    /* ═══ 宽屏三栏 ═══ */
    const deskMQ = window.matchMedia("(min-width: 960px)");
    let deskActive = false;
    let animGen = 0;
    function updateDeskMode() {
      const want = deskMQ.matches;
      if (want === deskActive) return;
      deskActive = want;
      document.getElementById("desk").hidden = !want;
      document.body.classList.toggle("desk-on", want);
      if (want) cardWrap.innerHTML = "";
      animGen++;
    }
    const dEl = (id) => document.getElementById(id);
    function deskPos() { return CARDS.filter((x, idx) => x.g === deck[state.i].c.g && idx <= deck[state.i].i).length; }
    function deskInGroup() { return CARDS.filter((x) => x.g === deck[state.i].c.g).length; }

    function artAreaSVG(art) {
      return `<svg viewBox="0 0 760 480" preserveAspectRatio="xMidYMid meet">${art || ""}</svg>`;
    }
    function carSVG(x, y, rot) {
      return `<g class="car" transform="translate(${x} ${y}) rotate(${rot || 0})">
        <rect x="-26" y="-20" width="52" height="24" rx="8" fill="${ACCENT}"/>
        <rect x="-14" y="-30" width="26" height="14" rx="5" fill="${ACCENT}"/>
        <circle cx="-13" cy="6" r="7" fill="${INK}"/><circle cx="15" cy="6" r="7" fill="${INK}"/>
        <circle cx="-13" cy="6" r="2.6" fill="#fff"/><circle cx="15" cy="6" r="2.6" fill="#fff"/></g>`;
    }
    function toneRoadsSVG(c) {
      /* 四声全景：每行＝调号 + 坡道 + 小汽车 + 例词（小汽车爬坡教学法） */
      const rows = [
        { road: "M 90 60 L 470 60",               car: [150, 36, 0],   tip: "一声平" },
        { road: "M 90 96 L 470 32",               car: [150, 74, -6],  tip: "二声扬" },
        { road: "M 90 38 L 280 106 L 470 42",     car: [140, 18, 0],   tip: "三声拐弯" },
        { road: "M 90 32 L 470 98",               car: [150, 12, 6],   tip: "四声降" },
      ];
      let s = `<svg viewBox="0 0 760 480" preserveAspectRatio="xMidYMid meet">
        <rect x="4" y="4" width="752" height="472" rx="26" fill="#fffdf3" stroke="#f3e7cd" stroke-width="3"/>`;
      rows.forEach((r, i) => {
        const top = 10 + i * 116;
        const w = c.words[i];
        s += `<g class="trow${i === 0 ? " on" : ""}" id="trow${i}" transform="translate(0 ${top})">
          <rect class="hl" x="10" y="2" width="740" height="108" rx="20" fill="#dff4f1"/>
          <path d="${r.road}" stroke="#c05a4a" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          ${carSVG(r.car[0], r.car[1], r.car[2])}
          <text x="575" y="60" text-anchor="middle" font-size="40" font-weight="700" fill="${ACCENT}">${esc(w.sy)}</text>
          <text x="575" y="96" text-anchor="middle" font-size="26" fill="${INK}">${esc(w.zi)}</text>
          <text x="678" y="80" font-size="21" fill="${MUTED}">${esc(r.tip)}</text>
        </g>`;
      });
      return s + `</svg>`;
    }

    function deskWriteLoop(container, letters, opt) {
      /* 自动笔顺：逐笔描画；loop=false 时写完停住（猜对庆祝用） */
      const gen = ++animGen;
      const keepLooping = !(opt && opt.loop === false);
      const W = letters.length * 100 + (letters.length - 1) * 6;
      let html = `<svg viewBox="-4 -4 ${W + 8} 148">
        <g transform="scale(${W / 100},1)">${gridLines().replaceAll('stroke-width="2.5"', 'stroke-width="0.5"').replaceAll('stroke-width="1.4"', 'stroke-width="0.3"')}</g>`;
      letters.forEach((L, li) => {
        html += `<g transform="translate(${li * 106} 0)">`;
        (STROKES[L] || []).forEach((st) => {
          html += `<path d="${st.d}" fill="none" stroke="${INK}" stroke-opacity="0.12" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;
        });
        html += `</g>`;
      });
      html += `</svg>`;
      container.innerHTML = html;
      const svg = container.querySelector("svg");
      const all = [];
      letters.forEach((L) => (STROKES[L] || []).forEach((st) => all.push(st)));
      const ps = all.map((st) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", st.d);
        p.setAttribute("fill", "none"); p.setAttribute("stroke", INK);
        p.setAttribute("stroke-width", "12"); p.setAttribute("stroke-linecap", "round");
        p.setAttribute("stroke-linejoin", "round"); p.setAttribute("pathLength", "1");
        p.style.strokeDasharray = "1 1.06"; p.style.strokeDashoffset = "1";
        svg.appendChild(p);
        return p;
      });
      let idx = 0;
      function step() {
        if (gen !== animGen) return;
        const nm = dEl("deskStrokeName");
        if (idx >= ps.length) {
          if (nm) nm.textContent = keepLooping ? "写完啦，再看一遍…" : "写对啦！🎉";
          if (!keepLooping) return;
          setTimeout(() => {
            if (gen !== animGen) return;
            ps.forEach((q) => { q.style.transition = "none"; q.style.strokeDashoffset = "1"; });
            idx = 0;
            setTimeout(step, 400);
          }, 1600);
          return;
        }
        ps[idx].getBoundingClientRect();
        ps[idx].style.transition = "stroke-dashoffset 700ms ease-in-out";
        ps[idx].style.strokeDashoffset = "0";
        if (nm) nm.textContent = `第 ${idx + 1} 笔 · ${all[idx].n}`;
        idx++;
        setTimeout(step, 900);
      }
      setTimeout(step, 350);
    }

    function renderDesk() {
      const { c } = deck[state.i];
      dEl("deskTitle").innerHTML = `${esc(TITLE)}<span class="s">${esc(SUB)}</span>`;
      if (GROUPS.length > 1) {
        dEl("deskChips").hidden = false;
        dEl("deskChips").innerHTML = GROUPS.map((g, gi) =>
          `<button class="dchip${gi === c.g ? " active" : ""}" data-g="${gi}">${esc(g.name)}</button>`).join("");
      }
      const modes = dEl("deskModes");
      modes.style.display = c.type === "letter" ? "flex" : "none";

      /* 左栏 */
      const winNow = c.type === "letter" && state.mode === "zhao" && state.revealed;
      dEl("deskCenter").closest(".card-box").classList.toggle("win", !!winNow);
      if (c.type === "letter") {
        dEl("deskLeft").innerHTML = `<div class="art-area">${artAreaSVG(artOf(c))}</div>
          <div class="desk-pill">${esc(c.jue)}</div>`;
      } else if (c.type === "tone") {
        dEl("deskLeft").innerHTML = `<div class="art-area">${toneRoadsSVG(c)}</div>
          <div class="desk-pill q">一声平 · 二声扬 · 三声拐弯 · 四声降</div>`;
        c._sel = Math.min(c._sel || 0, 3);
      } else if (c.type === "match") {
        dEl("deskLeft").innerHTML = state.revealed
          ? `<div class="art-area">${artAreaSVG(artOf(c))}</div><div class="desk-pill">${esc(c.zi)}（${esc(c.py)}）</div>`
          : `<div class="art-area">${artAreaSVG(artOf(c))}</div><div class="desk-pill q">${esc(c.hint || "猜猜：它的名字开头是哪个字母？")}</div>`;
      } else {
        dEl("deskLeft").innerHTML = `${c.art ? `<div class="art-area">${artAreaSVG(c.art)}</div>` : ""}
          <div class="desk-pill q" style="margin:10px 8px 4px">${esc(c.rule || "点下面的声母，和韵母碰一碰！")}</div>`;
      }

      /* 中栏：字母卡 = 自动逐笔写字（「一起读」），「猜一猜」藏字点选 */
      if (c.type === "letter") {
        const letters = c.combo || [c.letter];
        if (state.mode === "zhao" && !state.revealed) {
          dEl("deskCenter").innerHTML = `<div class="desk-hint">是哪个字母？点一点</div>
            <div class="quiz-row">${quizPool(c).map((L) =>
              `<button class="quiz-chip" data-l="${esc(L)}">${chipGlyph(L)}</button>`).join("")}</div>`;
          dEl("deskCenter").querySelectorAll(".quiz-chip").forEach((el) => {
            el.addEventListener("click", () => {
              const ok = el.dataset.l === c.letter;
              if (ok) {
                el.classList.add("right");
                state.revealed = true;
                celebrate();
                dEl("deskCenter").closest(".card-box").classList.add("win");
                setTimeout(renderDesk, 1000);   // 停一停，再写给你看
              } else {
                el.classList.remove("wrong"); void el.offsetWidth;
                el.classList.add("wrong");
              }
            });
          });
        } else {
          dEl("deskCenter").innerHTML = `<div class="board-wrap" id="dzBoard"></div>
            <div class="desk-hint" id="deskStrokeName">看笔尖怎么走…</div>`;
          deskWriteLoop(dEl("dzBoard"), letters, { loop: !(state.mode === "zhao") });
        }
      } else if (c.type === "tone") {
        const selW = c.words[c._sel || 0];
        dEl("deskCenter").innerHTML = `<div class="tone-grid">
          <div style="width:min(100%,46vh)">${toneBigRoadSVG(toneNumOf(selW.sy))}</div>
          <div class="pop" style="display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:8px 16px">
            <div style="width:150px">${syllableSVG(selW.sy, { grid: true })}</div>
            <div style="font-size:36px;font-weight:800">${esc(selW.zi)}</div>
            <div style="width:150px;height:95px">${artAreaSVG(selW.art || "")}</div>
          </div>
          <div class="word-tiles">${c.words.map((w, i) =>
            `<div class="word-tile${i === (c._sel || 0) ? " on" : ""}" data-i="${i}"><div class="wsy">${esc(w.sy)}</div>
             <div class="wart">${artAreaSVG(w.art || "")}</div>
             <div class="wzi">${esc(w.zi)}</div><div class="wsay">${esc(w.say)}</div></div>`).join("")}</div>
          <div class="desk-hint">点一个词，小汽车就开到那个声调的路上</div></div>`;
        dEl("deskCenter").querySelectorAll(".word-tile").forEach((el) => {
          el.addEventListener("click", () => {
            dEl("deskCenter").querySelectorAll(".word-tile").forEach((x) => x.classList.remove("on"));
            el.classList.add("on");
            const i = Number(el.dataset.i);
            c._sel = i;
            renderDesk();
            document.querySelectorAll("#deskLeft .trow").forEach((r, k) => r.classList.toggle("on", k === i));
            const w = c.words[i];
            speak(w.sy + "," + w.zi + "," + w.say);
          });
        });
      } else if (c.type === "match") {
        dEl("deskCenter").innerHTML = `<div class="match-flip" id="dzFlip">
          ${state.revealed
            ? `<div class="mback"><div class="board-wrap" style="width:min(70%,34vh)">${glyphSVG(c.letter, true, { w: 13 })}</div>
               <div style="font-size:40px;font-weight:800">${esc(c.zi)}</div>
               <div style="font-size:26px;color:var(--accent);font-weight:700">${syllableSVG(c.py)}</div></div>`
            : `<div class="match-face">${artAreaSVG(artOf(c))}</div>`}</div>
          <div class="desk-hint">${state.revealed ? "点一下翻回图" : "看图猜字母，点一下揭晓"}</div>`;
        dEl("dzFlip").onclick = () => { state.revealed = !state.revealed; renderDesk(); };
      } else if (c.type === "spell") {
        dEl("deskCenter").innerHTML = `<div class="spell-stage">
          <div class="spell-out board-wrap" style="aspect-ratio:auto" id="dzFinal">${glyphSVG(c.final === "ü" ? "ü" : c.final, true, { w: 13 })}</div>
          <div class="desk-hint">韵母 ${esc(c.final)} · 点一个声母碰一碰</div>
          <div class="spell-chips">${(c.chips || []).map((ch, i) =>
            `<button class="spell-chip" data-i="${i}" aria-label="${esc(ch.ini)}">${glyphSVG(ch.ini === "ü" ? "ü" : ch.ini, false, { w: 14 })}</button>`).join("")}</div>
          <div id="dzSpellOut"></div></div>`;
        dEl("deskCenter").querySelectorAll(".spell-chip").forEach((el) => {
          el.addEventListener("click", () => {
            const ch = c.chips[Number(el.dataset.i)];
            const out = dEl("dzSpellOut");
            out.innerHTML = `<div class="spell-reveal pop">
              <div class="rzi">${esc(ch.zi)}</div>
              <div style="width:150px">${syllableSVG(ch.sy, { grid: true })}</div>
              <div class="rart">${artAreaSVG(ch.art || "")}</div></div>
              <div class="desk-hint">${esc(ch.ini)} 和 ${esc(c.final)} 猛一碰 → ${esc(ch.sy)}！</div>`;
            speak(`${LETTER_SOUND[ch.ini] || ch.ini}、${LETTER_SOUND[c.final] || c.final}，${ch.sy}，${ch.zi}`);
          });
        });
      }

      /* 右栏 */
      let head = "";
      if (c.type === "letter") head = `<div class="desk-head"><span class="zi">${esc(c.letter)}</span><span class="meta">${esc(GROUPS[c.g].name)} · 卡 ${deskPos()} / ${deskInGroup()}</span></div>`;
      else if (c.type === "tone") head = `<div class="desk-head"><span class="zi">${esc(c.fam)}</span><span class="meta">四声 · 卡 ${deskPos()} / ${deskInGroup()}</span></div>`;
      else if (c.type === "match") head = `<div class="desk-head"><span class="zi">${state.revealed ? esc(c.letter) : "？"}</span><span class="meta">${esc(GROUPS[c.g].name)} · 卡 ${deskPos()} / ${deskInGroup()}</span></div>`;
      else head = `<div class="desk-head"><span class="zi">${esc(c.final)}</span><span class="meta">拼读游乐场</span></div>`;
      dEl("deskPanel").innerHTML = head + tipsHTML(c);

      /* 胶片条 */
      dEl("deskFilm").innerHTML = deck.map((d, i) => {
        if (d.c.g !== c.g) return "";
        const raw = d.c.type === "letter" ? d.c.letter : d.c.type === "tone" ? d.c.label : d.c.type === "match" ? d.c.letter : d.c.final;
        const L = (STROKES[raw] ? raw : raw[0]);
        return `<button class="mini${i === state.i ? " active" : ""}" data-i="${i}" title="${esc(raw)}">${glyphSVG(L === "v" ? "ü" : L, false, { w: 14 })}</button>`;
      }).join("");
      dEl("deskCounter").textContent = `${deskPos()} / ${deskInGroup()} · ${esc(GROUPS[c.g].name)}`;
      const act = document.querySelector("#deskFilm .mini.active");
      if (act) act.scrollIntoView({ block: "nearest", inline: "center" });
      /* 自动念：字母卡（猜一猜未答时不念，避免泄底）；配对卡翻开时 */
      if (c.type === "letter" && !(state.mode === "zhao" && !state.revealed)) speakLetter(c.letter);
      if (c.type === "match" && state.revealed) speakLetter(c.letter);
    }

    if (mode === "deck") {
      dEl("deskPrev").addEventListener("click", () => go(-1));
      dEl("deskNext").addEventListener("click", () => go(1));
      dEl("deskFilm").addEventListener("click", (e) => {
        const b = e.target.closest(".mini");
        if (b) { state.i = Number(b.dataset.i); state.revealed = false; state.strokeOn = false; render(); }
      });
      dEl("deskChips").addEventListener("click", (e) => {
        const b = e.target.closest(".dchip");
        if (b) jumpTo(Number(b.dataset.g));
      });
      dEl("deskModes").addEventListener("click", (e) => {
        const b = e.target.closest("[data-mode]");
        if (!b) return;
        state.mode = b.dataset.mode; state.revealed = false;
        dEl("deskModes").querySelectorAll(".pill").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        render();
      });
      deskMQ.addEventListener("change", () => { updateDeskMode(); render(); });
    }

    document.getElementById("head").innerHTML =
      `<span class="t">${esc(TITLE)}</span><span class="s">${esc(SUB)}</span>`;

    if (mode === "deck") {
      sheetGrid.innerHTML = GROUPS.map((g, gi) =>
        `<button class="chip" data-g="${gi}" aria-label="跳到${esc(g.name)}组">${esc(g.name)}</button>`).join("");
      const nParam = parseInt(qs.get("n"), 10);
      if (nParam >= 1 && nParam <= deck.length) state.i = nParam - 1;
      updateDeskMode();
      render();
      if (qs.get("sheet") === "1") openSheet();
      if (GROUPS.length > 1 && false) groupBtn.style.display = "none";
      if (!hasPrimary) primaryBtn.style.display = "none";
    } else if (mode === "grid") {
      document.body.classList.add("grid");
      document.getElementById("stage").innerHTML = deck.map((d) => cardSVG(d.c)).join("");
    }
  </script>

  <script>
  (function () {
    if (!/MicroMessenger/i.test(navigator.userAgent)) return;
    if (sessionStorage.getItem('wxTipDone')) return;
    var bar = document.createElement('div');
    bar.className = 'wx-tip';
    bar.innerHTML = '微信里用：点右上角「···」可<span style="color:#3e9486;font-weight:600">收藏</span>或加<span style="color:#3e9486;font-weight:600">浮窗</span>，下次秒开<span class="wx-x">✕</span>';
    bar.querySelector('.wx-x').addEventListener('click', function () {
      sessionStorage.setItem('wxTipDone', '1');
      bar.remove();
    });
    document.body.appendChild(bar);
    requestAnimationFrame(function () { bar.classList.add('show'); });
  })();
  </script>

</body>
</html>
